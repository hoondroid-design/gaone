<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국무용가 공식 홈페이지</title>
<meta name="description" content="한국무용가 공식 홈페이지. 이매방류 승무, 살풀이춤, 태평무, 화랭이춤, 검무, 소고춤 공연과 워크숍 문의.">
<meta property="og:type" content="website">
<meta property="og:title" content="한국무용가 공식 홈페이지">
<meta property="og:description" content="이매방류 승무, 살풀이춤, 태평무, 화랭이춤, 검무, 소고춤 공연과 워크숍 문의.">
<meta name="theme-color" content="#0B0B0A">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0B0B0A; --surface:#161615; --ink:#ECEAE4; --muted:#8F8D87; --line:#2B2B29;
  --kasa:#D25A5C; --brass:#B39C68; --on-ink:#0B0B0A;
  color-scheme:dark;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --wrap:1180px; --hdr:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kasa);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.serif{font-family:var(--serif)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.3;margin:0}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}
h3{font-size:1.2rem}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:24px;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:600;white-space:nowrap}
.brand-mark{font-size:1.05rem;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--ink)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;flex-direction:column;align-items:center;text-decoration:none;padding:6px 12px;line-height:1.2;border-radius:2px}
.nav a span{font-size:.9rem;font-weight:500}
.nav a small{font-size:.7rem;color:var(--muted)}
.nav a.on span{color:var(--kasa)}
.nav a:hover{background:var(--surface)}
.hdr-tools{display:flex;gap:8px;align-items:center}
.cart-btn{display:flex;gap:6px;align-items:center;text-decoration:none;font-size:.9rem;padding:8px 12px;border:1px solid var(--line);border-radius:999px}
.cart-btn b{background:var(--ink);color:var(--on-ink);border-radius:999px;font-size:.72rem;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.hdr-tools:empty{display:none}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;top:var(--hdr);left:0;right:0;flex-direction:column;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 18px 16px}
  .nav.open{display:flex}
  .nav a{flex-direction:row;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
  .hdr-tools{margin-left:auto}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);text-decoration:none;cursor:pointer;font-weight:500;border-radius:2px;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.kasa{background:#A6383B;border-color:#A6383B;color:#fff}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}

/* hero */
.hero{position:relative;min-height:calc(100svh - var(--hdr));display:flex;flex-direction:column;justify-content:flex-end;padding-top:clamp(28px,6vw,72px);padding-bottom:clamp(40px,7vw,88px);overflow:hidden}
.hero-copy{position:relative;z-index:2;max-width:min(100%,70rem)}
.hero-h{font-family:var(--serif);font-weight:600;font-size:clamp(1.85rem,5.2vw,4.4rem);line-height:1.28;letter-spacing:-.01em;margin:0 0 .6em;text-wrap:balance}
.hero-copy .who{margin:0 0 .4em;font-size:clamp(1rem,1.6vw,1.15rem);line-height:1.6}
.hero-copy .who b{font-family:var(--serif);font-weight:600;font-size:1.15em}
.hero-copy .who .en{color:var(--muted);margin-left:10px;font-size:.9em}
.hero-copy .reps-line{color:var(--muted);font-size:.92rem;margin-bottom:1.6em}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:700px){.hero{min-height:calc(88svh - var(--hdr))}}

.hero-slides{position:relative;height:calc(100svh - var(--hdr));min-height:520px;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.slide figcaption{position:absolute;right:clamp(18px,4vw,40px);top:20px;font-size:.8rem;color:rgba(236,234,228,.75)}
.slide-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.1) 100%),linear-gradient(to right,rgba(0,0,0,.5),transparent 55%);pointer-events:none}
.slide-inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-top:clamp(28px,6vw,64px);padding-bottom:clamp(76px,9vw,108px)}
.slide-ctrl{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:22px;display:flex;align-items:center;gap:10px}
.slide-ctrl > button{background:rgba(0,0,0,.45);color:var(--ink);border:1px solid rgba(236,234,228,.35);padding:7px 14px;min-height:34px;font-size:.8rem;cursor:pointer;border-radius:999px}
.slide-dots{display:flex;gap:6px}
.slide-dots{gap:0}
.slide-dots button{width:26px;height:26px;padding:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.slide-dots button::before{content:"";width:8px;height:8px;border-radius:50%;border:1px solid var(--ink)}
.slide-dots button.on::before{background:var(--ink)}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
@media (max-width:700px){.hero-slides{height:calc(88svh - var(--hdr));min-height:460px}.slide-shade{background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.15) 100%)}.slide figcaption{top:12px;font-size:.72rem}}
/* sections */
.sec{padding:clamp(56px,8vw,104px) 0;border-top:1px solid var(--line)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.sec-head p{margin:6px 0 0;color:var(--muted)}
.page-head{padding-top:clamp(40px,6vw,72px);padding-bottom:28px}
.page-head h1{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:600}
.page-head p{color:var(--muted);margin-top:10px;max-width:40rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.tabs a,.tabs button{padding:8px 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:none;cursor:pointer;font-size:.9rem}
.tabs .on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.empty{border:1px dashed var(--line);padding:40px 24px;text-align:center;color:var(--muted);border-radius:2px}
.prose{max-width:40rem;font-size:1.02rem}
.prose p{line-height:1.85}
.grid{display:grid;gap:clamp(16px,2.4vw,28px)}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}

/* about */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(24px,5vw,72px)}
@media (max-width:820px){.story{grid-template-columns:1fr}}
.costumes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.costume{background:var(--paper);padding:26px}
.costume svg{width:96px;height:96px;margin-bottom:14px;color:var(--ink)}
.costume h3{margin-bottom:8px}
.costume h3 small{font-family:var(--sans);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:6px}
.costume p{color:var(--muted);font-size:.95rem;margin:0}
.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.flow li{padding:18px 18px 0 0;position:relative}
.flow li b{font-family:var(--serif);font-size:1.15rem;display:block;margin-bottom:4px}
.flow li .n{font-size:.8rem;color:var(--kasa)}
.flow li p{font-size:.92rem;color:var(--muted)}
.flow .peak b{color:var(--kasa)}
@media (max-width:760px){.flow{grid-template-columns:1fr 1fr;gap:12px 0}}
.drum-quote{font-family:var(--serif);font-size:clamp(1.3rem,2.6vw,1.8rem);line-height:1.6;border-left:3px solid var(--kasa);padding-left:20px;margin:0 0 24px}
.artist{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:clamp(24px,5vw,72px);align-items:start}
@media (max-width:820px){.artist{grid-template-columns:1fr}}
.artist-photo{aspect-ratio:3/4;background:var(--surface);overflow:hidden}
.artist-photo img,.artist-photo svg{width:100%;height:100%;object-fit:cover}
.artist h2{font-size:clamp(2rem,4vw,2.8rem)}
.artist .en{color:var(--muted);margin-top:4px}
.artist .badge{display:inline-block;margin-top:14px;padding:4px 10px;border:1px solid var(--kasa);color:var(--kasa);font-size:.85rem}
.cv{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:32px}
@media (max-width:600px){.cv{grid-template-columns:1fr}}
.cv h3{font-size:1rem;padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:10px}
.cv ul{list-style:none;padding:0;margin:0}
.cv li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}

.login{max-width:460px;padding-top:clamp(48px,8vw,96px);padding-bottom:96px}
.login h1{font-size:1.8rem;margin-bottom:10px}
.login .form{margin-top:24px}
.login-msg{color:var(--kasa);margin-top:14px;font-size:.92rem}
.artist-hero{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:clamp(24px,5vw,72px);padding-top:clamp(32px,6vw,72px);padding-bottom:clamp(48px,7vw,88px);align-items:start}
@media (max-width:820px){.artist-hero{grid-template-columns:1fr}}
.artist-hero h1{font-size:clamp(2.4rem,5.4vw,4rem);margin-top:6px}
.artist-hero .en{color:var(--muted);margin-top:4px}
.artist-hero .badge{display:inline-block;margin-top:14px;padding:4px 10px;border:1px solid var(--kasa);color:var(--kasa);font-size:.85rem}
.perf-year{display:grid;grid-template-columns:120px 1fr;gap:20px;border-top:1px solid var(--ink);padding-top:14px;margin-bottom:28px}
.perf-year h3{font-size:1.5rem}
@media (max-width:640px){.perf-year{grid-template-columns:1fr;gap:4px}}
.perf-list{list-style:none;padding:0;margin:0}
.perf{display:grid;grid-template-columns:100px 1fr auto;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.perf .pd8{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.perf-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.perf-tags i{font-style:normal;font-size:.78rem;border:1px solid var(--line);padding:1px 7px}
@media (max-width:640px){.perf{grid-template-columns:1fr}.perf-tags{justify-content:flex-start}}
.codebox{width:100%;min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:pre}
/* repertoire */
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.rep{background:var(--paper);padding:26px;display:flex;flex-direction:column}
.rep-ill svg{width:72px;height:72px;color:var(--ink);margin-bottom:12px}
.rep h3{font-size:1.35rem;margin-bottom:4px}
.rep h3 small{font-family:var(--sans);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:8px}
.rep-st{font-size:.82rem;color:var(--kasa);margin-bottom:10px}
.rep p{font-size:.95rem}
.rep-note{background:var(--surface);padding:10px 12px;font-size:.9rem}
.rep-note b{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
.rep .src{margin-top:auto}
.src{font-size:.78rem;color:var(--muted);line-height:1.5;margin:12px 0 0}
.src a{color:var(--muted)}
.rep-strip{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--ink)}
.rep-mini{display:flex;flex-direction:column;gap:6px;padding:22px 14px 22px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.rep-mini svg{width:56px;height:56px;color:var(--ink)}
.rep-mini b{font-family:var(--serif);font-size:clamp(1.15rem,2vw,1.45rem);font-weight:600}
.rep-mini small{font-size:.78rem;color:var(--kasa)}
.rep-mini:hover b{text-decoration:underline;text-underline-offset:4px}
@media (max-width:900px){.rep-strip{grid-template-columns:repeat(3,1fr)}}@media (max-width:520px){.rep-strip{grid-template-columns:repeat(2,1fr)}}
.story.fact{margin-top:clamp(32px,5vw,56px)}
.story h3{font-size:1.25rem}
.flow5{grid-template-columns:repeat(5,1fr)}
@media (max-width:760px){.flow5{grid-template-columns:1fr 1fr}}
.terms{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.terms li{border:1px solid var(--line);padding:4px 10px;font-size:.9rem}
.src-group{border-top:1px solid var(--ink);padding-top:18px;margin-bottom:40px;display:grid;grid-template-columns:200px 1fr;gap:20px}
.src-group h2{font-size:1.2rem}
@media (max-width:700px){.src-group{grid-template-columns:1fr;gap:10px}}
.src-list{list-style:none;padding:0;margin:0;counter-reset:src}
.src-list li{display:grid;grid-template-columns:2em 1fr;padding:12px 0;border-bottom:1px solid var(--line);counter-increment:src}
.src-list li::before{content:counter(src);color:var(--muted);font-size:.85rem;grid-row:1/3;padding-top:2px}
.src-list a{font-weight:500;text-underline-offset:3px}
.src-list span{color:var(--muted);font-size:.88rem;margin-top:4px}
.refs{padding-left:1.2em;font-size:.93rem}
.refs li{padding:4px 0}

/* video */
.vcard{display:block;text-align:left;width:100%;border:0;padding:0;background:none;cursor:pointer}
.vthumb{aspect-ratio:16/9;background:var(--surface);color:var(--ink);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
.vthumb .cat{font-size:.78rem;opacity:.7}
.vthumb .t{font-family:var(--serif);font-size:1.3rem;line-height:1.35;max-width:85%}
.vthumb .play{position:absolute;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center}
.vthumb svg.sleeve{position:absolute;right:-10%;top:-20%;width:70%;opacity:.25}
.vcard:hover .play{background:var(--kasa);border-color:var(--kasa);color:#fff}
.vmeta{padding:10px 2px 0;font-size:.88rem;color:var(--muted)}
.vcard.off{cursor:default}
.vcard.off .vthumb{opacity:.55}

/* gallery */
.masonry{columns:3 260px;column-gap:14px}
.masonry button{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:none;cursor:zoom-in;break-inside:avoid}
.masonry img{width:100%}
.masonry .cap{font-size:.82rem;color:var(--muted);text-align:left;padding-top:6px}

/* projects */
.proj{display:grid;grid-template-columns:120px 1fr minmax(0,240px);gap:24px;padding:28px 0;border-top:1px solid var(--line);align-items:start}
.proj:last-child{border-bottom:1px solid var(--line)}
.proj .yr{font-family:var(--serif);font-size:1.4rem}
.proj .genre{display:inline-block;font-size:.8rem;color:var(--kasa);margin-bottom:6px}
.proj h3{margin-bottom:8px}
.proj .pimg{aspect-ratio:4/3;background:var(--surface);overflow:hidden}
.proj .pimg img{width:100%;height:100%;object-fit:cover}
@media (max-width:760px){.proj{grid-template-columns:1fr;gap:10px}}

/* store */
.store-bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.store-bar .tabs{margin:0}
select.sort{padding:8px 12px;border:1px solid var(--line);background:var(--paper);border-radius:2px}
.pcard{display:block;text-decoration:none}
.pimg{aspect-ratio:1;background:var(--surface);overflow:hidden;position:relative}
.pimg img,.pimg svg{width:100%;height:100%;object-fit:cover}
.pcard:hover .pimg img{transform:scale(1.03)}
.pimg img{transition:transform .4s}
.soldout{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--on-ink);font-size:.75rem;padding:3px 8px}
.pname{margin-top:12px;font-weight:500}
.pcat{font-size:.8rem;color:var(--muted)}
.pprice{margin-top:4px;font-weight:600}
.pprice s{color:var(--muted);font-weight:400;margin-right:6px;font-size:.88rem}
.pprice .off{color:var(--kasa);margin-right:6px}
.pd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);padding:36px 0 72px}
@media (max-width:820px){.pd{grid-template-columns:1fr}}
.pd-main{aspect-ratio:1;background:var(--surface);overflow:hidden}
.pd-main img,.pd-main svg{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumbs button{width:72px;height:72px;padding:0;border:1px solid var(--line);background:var(--surface);cursor:pointer;overflow:hidden}
.thumbs button.on{border-color:var(--ink);border-width:2px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:clamp(1.6rem,3vw,2.2rem);margin:6px 0 10px}
.pd .price-big{font-size:1.5rem;font-weight:600;margin:10px 0 18px}
.pd .price-big s{font-size:1rem;color:var(--muted);font-weight:400;margin-right:8px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;font-size:.92rem;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.qty{display:inline-flex;border:1px solid var(--line);align-items:center}
.qty button{width:38px;height:38px;border:0;background:none;cursor:pointer;font-size:1.1rem}
.qty span{min-width:40px;text-align:center}
.total-line{display:flex;justify-content:space-between;align-items:center;margin:18px 0}
.total-line b{font-size:1.3rem}
.pd-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  return `<svg viewBox="0 0 400 400" role="img" aria-label="${esc(label || "")}" preserveAspectRatio="xMidYMid slice"><rect width="400" height="400" fill="var(--surface)"/><path d="M-20 ${330-c2} C ${100+a} ${120+b}, ${220-b} ${60+a}, 420 ${40+c2}" fill="none" stroke="var(--ink)" stroke-width="1.6"/><path d="M-20 ${370-c2} C ${140+a} ${170+b}, ${260-b} ${110+a}, 420 ${100+c2}" fill="none" stroke="var(--ink)" stroke-opacity=".3"/><path d="M${150+a} 262 l34 -20" stroke="var(--kasa)" stroke-width="6" stroke-linecap="round"/></svg>`;
}
function imgOr(id, seed, label){ return id ? `<img src="${blob(id)}" alt="${esc(label || "")}" loading="lazy">` : art(seed, label); }

/* ---------- products ---------- */
const unit = p => (Number(p.salePrice) > 0 && Number(p.salePrice) < Number(p.price)) ? Number(p.salePrice) : Number(p.price) || 0;
const tracked = p => p.stock !== null && p.stock !== undefined && p.stock !== "";
const soldOut = p => p.status === "품절" || (tracked(p) && Number(p.stock) <= 0);
const visibleProducts = () => S.products.filter(p => p.status !== "숨김");
const findP = id => S.products.find(p => p.id === id);
function priceHtml(p){
  const u = unit(p);
  if (u < Number(p.price)) { const off = Math.round((1 - u / Number(p.price)) * 100); return `<s>${won(p.price)}</s><span class="off">${off}%</span>${won(u)}`; }
  return won(u);
}
function cartLines(){ return S.cart.map(l => ({...l, p: findP(l.pid)})).filter(l => l.p && l.p.status !== "숨김"); }
const cartCount = () => S.cart.reduce((s, l) => s + l.qty, 0);
function totals(ls){ const sub = ls.reduce((s, l) => s + unit(l.p) * l.qty, 0); const ship = sub === 0 || sub >= FREE_SHIP ? 0 : SHIP; return {sub, ship, total: sub + ship}; }
function addToCart(pid, qty){
  const p = findP(pid); if (!p || soldOut(p)) return false;
  const ex = S.cart.find(l => l.pid === pid);
  let q = (ex ? ex.qty : 0) + qty;
  if (tracked(p)) q = Math.min(q, Number(p.stock));
  if (ex) ex.qty = q; else S.cart.push({pid, qty: q});
  saveCart(); return true;
}

  return `<div class="wrap page-head"><h1>자료출처</h1><p>이 사이트의 전통춤 설명은 아래 공공기관 자료를 바탕으로 요약해 다시 쓴 것입니다. 원문을 옮기지 않았으며, 사진과 영상 자료는 사용하지 않았습니다.</p></div>
  <div class="wrap" style="padding-bottom:80px">
    ${orgs.map(o => `<section class="src-group"><h2>${esc(o)}</h2><ol class="src-list">${Object.values(SRC).filter(x => x.org === o).map(x => `<li><a href="${x.u}" target="_blank" rel="noopener">${esc(x.t)}</a><span>${esc(x.used)}</span></li>`).join("")}</ol></section>`).join("")}
    <section class="src-group"><h2>확인일과 이용 조건</h2><div class="prose">
      <p>모든 자료의 확인일은 ${SRC_CHECKED}입니다. 기관 누리집의 내용이 바뀌었을 수 있으니 원문 링크에서 최신 내용을 확인해 주세요.</p>
      <p>국립국악원 국악사전의 원고는 공공누리 제2유형(출처 표시, 상업적 이용 금지), 사진과 영상 등 복합매체 자료는 공공누리 제4유형(출처 표시, 상업적 이용 금지, 변경 금지)으로 공개되어 있습니다.</p>
    </div></section>
  </div>`;
}

function vArtist(){
  const p = S.profile;
  const career = lines(p.career), awards = lines(p.awards);
  const perf = S.performances;
  const key = perf.filter(x => x.highlight === "주요 공연");
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = S.news.filter(n => n.type === "일정" && String(n.date || "") >= today).slice().reverse();
  const press = S.news.filter(n => n.type !== "일정");
  const years = [...new Set(perf.map(x => String(x.date || "").slice(0, 4)).filter(Boolean))];
  const perfRow = x => `<li class="perf"><span class="pd8">${fmtDate(x.date)}</span><div><b>${esc(x.title)}</b>${x.link ? ` <a href="${esc(x.link)}" target="_blank" rel="noopener" class="muted" style="font-size:.85rem">자료 보기</a>` : ""}<div class="muted" style="font-size:.88rem">${esc([x.venue, x.host].filter(Boolean).join(", "))}</div></div><span class="perf-tags">${[x.role, x.repertoire].filter(Boolean).map(t => `<i>${esc(t)}</i>`).join("")}</span></li>`;
  return `<section class="wrap artist-hero">
    <div class="artist-photo">${imgOr(p.photo, "artist", p.name)}</div>
    <div>
      <p class="muted">Artist</p>
      <h1>${esc(p.name || "무용가 이름")}</h1>
      ${p.nameEn ? `<p class="en">${esc(p.nameEn)}</p>` : ""}
      ${p.title ? `<span class="badge">${esc(p.title)}</span>` : ""}
      ${p.philosophy ? `<p class="drum-quote" style="margin-top:28px;font-size:1.25rem">${esc(p.philosophy).replace(/\n/g, "<br>")}</p>` : ""}
      ${p.lineage ? `<div class="prose" style="margin-top:20px"><h3 style="font-size:1rem;margin-bottom:8px">사승 관계</h3>${paras(p.lineage)}</div>` : ""}
      <div class="btn-row" style="margin-top:24px"><a class="btn kasa" href="#/contact/performance">공연 섭외 문의</a><a class="btn ghost" href="#/portfolio/video">공연 영상</a></div>
    </div>
  </section>
  ${key.length ? `<section class="sec"><div class="wrap">
    <div class="sec-head"><div><h2>주요 공연</h2></div></div>
    <div class="grid g3">${key.map(x => `<article class="keyperf">${x.image ? `<div class="pimg" style="aspect-ratio:4/3"><img src="${blob(x.image)}" alt="${esc(x.title)}" loading="lazy"></div>` : ""}<p class="muted" style="font-size:.85rem;margin:12px 0 4px">${fmtDate(x.date)}${x.venue ? `, ${esc(x.venue)}` : ""}</p><h3>${esc(x.title)}</h3>${x.role || x.repertoire ? `<p class="rep-st" style="margin-top:6px">${esc([x.role, x.repertoire].filter(Boolean).join(", "))}</p>` : ""}${x.description ? `<p style="font-size:.93rem">${esc(x.description)}</p>` : ""}</article>`).join("")}</div>
  </div></section>` : ""}
  <section class="sec"><div class="wrap">
    <div class="sec-head"><div><h2>공연 레퍼런스</h2><p>무대에 오른 기록을 연도별로 정리했습니다.</p></div></div>
    ${perf.length ? years.map(y => `<div class="perf-year"><h3>${y}</h3><ul class="perf-list">${perf.filter(x => String(x.date || "").startsWith(y)).map(perfRow).join("")}</ul></div>`).join("") : (S.loaded ? `<div class="empty">등록된 공연 기록이 없어요.</div>` : loading())}
  </div></section>
  <section class="sec"><div class="wrap">
    <div class="cv">
      <div><h3>주요 이력</h3>${career.length ? `<ul>${career.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="muted">등록된 이력이 없어요.</p>`}</div>
      <div><h3>수상</h3>${awards.length ? `<ul>${awards.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="muted">등록된 수상 내역이 없어요.</p>`}</div>
    </div>
  </div></section>
  ${upcoming.length ? `<section class="sec"><div class="wrap"><div class="sec-head"><div><h2>다가오는 공연</h2></div></div><div class="news-list">${upcoming.map(newsRow).join("")}</div></div></section>` : ""}
  <section class="sec"><div class="wrap">
    <div class="sec-head"><div><h2>언론과 평론</h2><p>보도, 인터뷰, 평론, 칼럼</p></div>${press.length > 6 ? `<a class="btn ghost sm" href="#/news">전체 보기</a>` : ""}</div>
    ${press.length ? `<div class="news-list">${press.slice(0, 6).map(newsRow).join("")}</div>` : (S.loaded ? `<div class="empty">등록된 기사가 없어요.</div>` : "")}
  </div></section>`;
}

function vPortfolio(sub){
  sub = sub || "video";
  const tabs = [["video","Video"],["gallery","Gallery"],["projects","Projects &amp; Collaborations"]];
  let body = "";
  if (sub === "video"){
    const list = S.videos;
    body = `${loading()}${list.length ? `<div class="grid g3">${list.map(videoCard).join("")}</div>` : (S.loaded ? `<div class="empty">이 분류에는 아직 영상이 없어요.</div>` : "")}`;
  } else if (sub === "gallery"){
    body = S.gallery.length ? `<div class="masonry">${S.gallery.map((g, i) => `<button data-act="img" data-i="${i}"><img src="${blob(g.image)}" alt="${esc(g.caption || "공연 사진")}" loading="lazy"><div class="cap">${esc(g.caption || "")}</div></button>`).join("")}</div>` : (S.loaded ? `<div class="empty">아직 사진이 없어요.${S.isAdmin ? ` <a href="#/admin/gallery">관리자 화면에서 올리기</a>` : ""}</div>` : loading());
  } else {
    body = S.projects.length ? `<div>${S.projects.map(pr => `<article class="proj"><div class="yr">${esc(pr.year || "")}</div><div><span class="genre">${esc(pr.genre || "")}</span><h3>${esc(pr.title)}</h3>${pr.partners ? `<p class="muted" style="font-size:.9rem">함께한 이: ${esc(pr.partners)}</p>` : ""}<div class="prose">${paras(pr.description)}</div>${pr.link ? `<a href="${esc(pr.link)}" target="_blank" rel="noopener">자세히 보기</a>` : ""}</div><div>${pr.image ? `<div class="pimg"><img src="${blob(pr.image)}" alt="${esc(pr.title)}" loading="lazy"></div>` : ""}</div></article>`).join("")}</div>` : (S.loaded ? `<div class="empty">등록된 프로젝트가 없어요.</div>` : loading());
  }
  return `<div class="wrap page-head"><h1>Portfolio</h1><p>무대의 기록, 그리고 전통춤을 바탕으로 한 창작과 다른 장르와의 협업.</p></div>
  <div class="wrap" style="padding-bottom:80px"><div class="tabs">${tabs.map(([k, l]) => `<a href="#/portfolio/${k}" class="${sub === k ? "on" : ""}">${l}</a>`).join("")}</div>${body}</div>`;
}

function vStore(){
  const all = visibleProducts();
  let list = all.slice();
  if (S.storeSort === "low") list.sort((a, b) => unit(a) - unit(b));
  else if (S.storeSort === "high") list.sort((a, b) => unit(b) - unit(a));
  return `<div class="wrap page-head"><h1>Store</h1><p>전통춤의 미학을 지금의 생활로. 장삼의 곡선, 수건의 흰빛, 북의 리듬을 담은 물건들입니다.</p></div>
  <div class="wrap" style="padding-bottom:80px">${offlineNote()}
    <div class="store-bar"><span class="muted">${list.length}개의 상품</span><a href="#/cart" class="cart-btn" style="margin-left:auto">장바구니 <b>${cartCount()}</b></a>
    <label><span class="sr">정렬</span><select class="sort" data-act-change="ssort"><option value="new" ${S.storeSort === "new" ? "selected" : ""}>신상품순</option><option value="low" ${S.storeSort === "low" ? "selected" : ""}>낮은 가격순</option><option value="high" ${S.storeSort === "high" ? "selected" : ""}>높은 가격순</option></select></label></div>
    ${loading()}${list.length ? `<div class="grid g4">${list.map(productCard).join("")}</div>` : (S.loaded ? `<div class="empty">표시할 상품이 없어요.</div>` : "")}
  </div>`;
}

function vProduct(id){
  const p = findP(id);
  if (!p || p.status === "숨김") return `<div class="wrap done"><h1>상품을 찾을 수 없어요</h1><p class="muted">판매가 끝났거나 주소가 바뀌었을 수 있어요.</p><a class="btn" href="#/store">스토어로 돌아가기</a></div>`;
  const imgs = p.images || [];
  const cur = Math.min(S.pdImg[id] || 0, Math.max(0, imgs.length - 1));
  const q = S.qty[id] || 1;
  const so = soldOut(p);
  return `<div class="wrap"><div class="crumbs" style="display:flex;justify-content:space-between;align-items:center"><a href="#/store">스토어</a><a href="#/cart" class="cart-btn">장바구니 <b>${cartCount()}</b></a></div>
  <div class="pd">
    <div><div class="pd-main">${imgOr(imgs[cur], p.id, p.name)}</div>
      ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((im, i) => `<button class="${i === cur ? "on" : ""}" data-act="pdimg" data-id="${esc(id)}" data-i="${i}" aria-label="${i+1}번째 이미지"><img src="${blob(im)}" alt=""></button>`).join("")}</div>` : ""}</div>
    <div>
            <h1>${esc(p.name)}</h1>
      ${p.summary ? `<p class="muted">${esc(p.summary)}</p>` : ""}
      <div class="price-big">${priceHtml(p)}</div>
      <dl class="kv"><dt>재고</dt><dd>${so ? "품절" : tracked(p) ? `${Number(p.stock)}개 남음` : "구매 가능"}</dd><dt>배송비</dt><dd>${won(SHIP)} (${won(FREE_SHIP)} 이상 무료)</dd><dt>결제</dt><dd>무통장 입금</dd></dl>
      ${so ? `<button class="btn" disabled style="width:100%">품절된 상품입니다</button>` : `
      <div style="display:flex;justify-content:space-between;align-items:center"><span>수량</span><div class="qty"><button data-act="qty" data-id="${esc(id)}" data-d="-1" aria-label="수량 줄이기">−</button><span aria-live="polite">${q}</span><button data-act="qty" data-id="${esc(id)}" data-d="1" aria-label="수량 늘리기">+</button></div></div>
      <div class="total-line"><span>총 상품 금액</span><b>${won(unit(p) * q)}</b></div>
      <div class="pd-actions"><button class="btn ghost" data-act="addcart" data-id="${esc(id)}">장바구니 담기</button><button class="btn" data-act="buynow" data-id="${esc(id)}">바로 구매</button></div>`}
      ${p.description ? `<div class="pd-desc">${esc(p.description)}</div>` : ""}
    </div>
  </div></div>`;
}

function vCart(){
  const ls = cartLines(), t = totals(ls);
  if (!ls.length) return `<div class="wrap done"><h1>장바구니가 비어 있어요</h1><p class="muted">마음에 드는 상품을 담아 보세요.</p><a class="btn" href="#/store">스토어 둘러보기</a></div>`;
  return `<div class="wrap page-head"><h1>장바구니</h1></div>
  <div class="wrap cart"><div>${ls.map(l => `<div class="cline"><div class="ci">${imgOr((l.p.images || [])[0], l.p.id, l.p.name)}</div>
    <div><a class="cn" href="#/product/${encodeURIComponent(l.pid)}">${esc(l.p.name)}</a><div class="muted" style="font-size:.88rem">${won(unit(l.p))}</div>
      <div style="display:flex;gap:14px;align-items:center;margin-top:8px"><div class="qty"><button data-act="cq" data-id="${esc(l.pid)}" data-d="-1" aria-label="수량 줄이기">−</button><span>${l.qty}</span><button data-act="cq" data-id="${esc(l.pid)}" data-d="1" aria-label="수량 늘리기">+</button></div><button class="linkbtn rm" data-act="crm" data-id="${esc(l.pid)}">삭제</button></div>
      ${soldOut(l.p) ? `<div style="color:var(--kasa);font-size:.85rem;margin-top:6px">품절된 상품이에요. 삭제 후 주문해 주세요.</div>` : ""}</div>
    <div class="cp"><b>${won(unit(l.p) * l.qty)}</b></div></div>`).join("")}</div>
  <aside class="summary"><div class="row"><span>상품 금액</span><span>${won(t.sub)}</span></div><div class="row"><span>배송비</span><span>${t.ship ? won(t.ship) : "무료"}</span></div><div class="row total"><span>결제 예정 금액</span><span>${won(t.total)}</span></div>
    <p class="note">${t.ship ? `${won(FREE_SHIP - t.sub)} 더 담으면 무료 배송이에요.` : "무료 배송이 적용됐어요."}</p>
    <a class="btn" href="#/checkout" ${ls.some(l => soldOut(l.p)) ? 'aria-disabled="true" style="pointer-events:none;opacity:.4"' : ""}>주문하기</a></aside></div>`;
}

function vCheckout(){
  const ls = cartLines(), t = totals(ls);
  if (!ls.length) return vCart();
  const d = draft("checkout");
  const f = (k, l, type, req, wide, ph) => `<div class="fld ${wide ? "wide" : ""}"><label for="co-${k}">${l}${req ? " <i>*</i>" : ""}</label><input id="co-${k}" name="${k}" type="${type}" value="${esc(d[k] || "")}" ${req ? "required" : ""} ${ph ? `placeholder="${esc(ph)}"` : ""}></div>`;
  return `<div class="wrap page-head"><h1>주문서 작성</h1></div>
  <form class="wrap cart" data-form="checkout" data-draft="checkout" novalidate><div>
    
    <fieldset class="fieldset"><h3>주문자 정보</h3><div class="form">${f("name","이름","text",1)}${f("phone","연락처","tel",1,0,"010-0000-0000")}${f("email","이메일","email",0,1)}</div></fieldset>
    <fieldset class="fieldset"><h3>배송지</h3><div class="form">${f("zip","우편번호","text",0)}<div></div>${f("address","주소","text",1,1)}${f("address2","상세 주소","text",0,1)}<div class="fld wide"><label for="co-memo">배송 메모</label><input id="co-memo" name="memo" value="${esc(d.memo || "")}" placeholder="예: 문 앞에 놓아 주세요"></div></div></fieldset>
    <fieldset class="fieldset"><h3>결제 수단</h3><label class="check"><input type="radio" checked disabled> 무통장 입금</label>${S.profile.bank ? `<p class="hint" style="margin-top:8px">입금 계좌: ${esc(S.profile.bank)}</p>` : ""}<p class="hint">주문 후 3일 이내 입금이 확인되지 않으면 주문이 취소될 수 있어요.</p></fieldset>
    <label class="check"><input type="checkbox" name="agree" ${d.agree ? "checked" : ""}> 주문 내용을 확인했으며 개인정보 수집, 이용(배송 목적)에 동의합니다. <a href="#/privacy" target="_blank">내용 보기</a></label>
  </div>
  <aside class="summary">${ls.map(l => `<div class="row"><span>${esc(l.p.name)} × ${l.qty}</span><span>${won(unit(l.p) * l.qty)}</span></div>`).join("")}
    <div class="row" style="border-top:1px solid var(--line);margin-top:8px;padding-top:12px"><span>배송비</span><span>${t.ship ? won(t.ship) : "무료"}</span></div>
    <div class="row total"><span>총 결제 금액</span><span>${won(t.total)}</span></div><p class="note"></p>
    <button class="btn kasa" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "주문 보내는 중…" : `${won(t.total)} 주문하기`}</button></aside></form>`;
}

function vOrderDone(id){
  const o = S.myOrders.find(x => x.id === id);
  if (!o) return `<div class="wrap done"><h1>주문 내역을 불러오는 중이에요</h1><p class="muted">잠시 후에도 보이지 않으면 <a href="#/orders">주문 조회</a>에서 확인해 주세요.</p></div>`;
  return `<div class="wrap done"><h1>주문이 접수됐어요</h1><p class="muted">주문번호 ${esc(o.id)}</p>
    <div class="bank"><div class="row" style="display:flex;justify-content:space-between"><span>입금하실 금액</span><b>${won(o.total)}</b></div>${S.profile.bank ? `<p style="margin:10px 0 0">입금 계좌: ${esc(S.profile.bank)}</p>` : ""}<p class="hint" style="margin-top:8px">입금이 확인되면 주문 상태가 '결제완료'로 바뀌고 순서대로 발송됩니다.</p></div>
    <div class="btn-row" style="justify-content:center"><a class="btn" href="#/orders">주문 내역 보기</a><a class="btn ghost" href="#/store">쇼핑 계속하기</a></div></div>`;
}

function statusCls(s){ return s === "입금대기" ? "wait" : s === "취소" ? "cancel" : ""; }
function vOrders(){
  return `<div class="wrap page-head"><h1>주문 조회</h1><p>이 브라우저에서 주문한 내역이에요. 다른 기기에서 주문하셨다면 주문번호와 함께 문의해 주세요.</p></div>
  <div class="wrap" style="padding-bottom:80px">
  ${S.myOrders.length ? `<div class="scroll-x"><table class="otable"><thead><tr><th>주문일</th><th>주문번호</th><th>상품</th><th>금액</th><th>상태</th></tr></thead><tbody>${S.myOrders.map(o => `<tr><td>${fmtDate(o.createdAt)}</td><td>${esc(o.id)}</td><td>${o.items.map(i => `${esc(i.name)} × ${i.qty}`).join("<br>")}</td><td>${won(o.total)}</td><td><span class="status ${statusCls(o.status)}">${esc(o.status)}</span></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">주문 내역이 없어요. <a href="#/store">스토어 둘러보기</a></div>`}</div>`;
}

function vNews(id){
  if (id){
    const n = S.news.find(x => x.id === id);
    if (!n) return `<div class="wrap done"><h1>${S.loaded ? "글을 찾을 수 없어요" : "불러오는 중…"}</h1><a class="btn ghost" href="#/news">목록으로</a></div>`;
    return `<div class="wrap"><article class="article"><a href="#/news" class="muted" style="font-size:.88rem">소식 목록</a>
      <div style="margin-top:20px"><span class="nt" style="color:var(--kasa);font-size:.88rem">${esc(n.type || "")}</span></div><h1>${esc(n.title)}</h1>
      <div class="meta">${fmtDate(n.date)}${n.source ? `, ${esc(n.source)}` : ""}${n.venue ? `, ${esc(n.venue)}` : ""}</div>
      ${n.image ? `<img src="${blob(n.image)}" alt="">` : ""}<div class="body">${paras(n.body || n.summary)}</div>

function fieldHtml(f, d, key){
  const v = d[f.k] ?? "", id = `${key}-${f.k}`, req = f.req ? "required" : "";
  let inp;
  if (f.t === "image" || f.t === "images"){
    const ids = f.t === "images" ? (d[f.k] || []) : (d[f.k] ? [d[f.k]] : []);
    inp = !S.canUpload ? `<p class="hint">이미지 업로드를 사용할 수 없어요. 관리자로 로그인해 주세요.</p>` :
      `<div class="imgs">${ids.map((im, i) => `<div class="ti"><img src="${blob(im)}" alt=""><button type="button" data-act="imgrm" data-k="${f.k}" data-i="${i}" aria-label="이미지 삭제">삭제</button></div>`).join("")}
      ${(f.t === "images" || !ids.length) ? `<label class="upl">${S.uploading === f.k ? "올리는 중…" : "이미지<br>추가"}<input type="file" accept="image/*" ${f.t === "images" ? "multiple" : ""} data-upload="${f.k}" data-multi="${f.t === "images" ? 1 : 0}"></label>` : ""}</div>`;
  } else if (f.t === "textarea") inp = `<textarea id="${id}" name="${f.k}" rows="${f.rows || 5}" ${req}>${esc(v)}</textarea>`;
  else if (f.t === "select") inp = `<select id="${id}" name="${f.k}" ${req}><option value="">선택</option>${f.opts.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else inp = `<input id="${id}" name="${f.k}" type="${f.t === "number" ? "number" : f.t === "date" ? "date" : "text"}" ${f.t === "number" ? 'min="0" step="1" inputmode="numeric"' : ""} value="${esc(v)}" ${req} ${f.list ? `list="${id}-l"` : ""}>${f.list ? `<datalist id="${id}-l">${f.list.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : ""}`;
  return `<div class="fld ${f.wide ? "wide" : ""}"><label for="${id}">${esc(f.l)}${f.req ? " <i>*</i>" : ""}</label>${inp}${f.hint ? `<p class="hint">${esc(f.hint)}</p>` : ""}</div>`;
}

  S.busy = false; render();

setInterval(() => { if (S.authed && Date.now() - (S.lastAct || 0) > IDLE_MS){ logout(); toast("20분 동안 사용하지 않아 자동으로 로그아웃했어요"); } }, 30000);
let adminUnsubs = [];
function startAdmin(){
  if (S.adminStarted || !S.online) return; S.adminStarted = true; S.lastAct = Date.now();
  logAccess();
  adminUnsubs.push(FS.collection("orders").onSnapshot(snap => { S.allOrders = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); softRender(); }, () => {}));
  adminUnsubs.push(FS.collection("inquiries").onSnapshot(snap => { S.inquiries = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); softRender(); }, () => {}));
  adminUnsubs.push(FS.latest("adminLog", "t", 15).onSnapshot(snap => { S.accessLog = snap.docs.map(d => d.data()); softRender(); }, () => {}));
  S.canUpload = true; render();
}
function stopAdmin(){
  adminUnsubs.forEach(u => { try { u(); } catch(e){} }); adminUnsubs = [];
  Object.assign(S, {authed: false, adminStarted: false, allOrders: [], inquiries: [], accessLog: [], canUpload: false, edit: null});
  S.drafts.edit = null; S.drafts.profile = null; S.drafts.meta = null;
}
async function logout(){
  stopAdmin(); S.authStep = "login"; S.mfaResolver = null; S.totpSecret = null; S.authMsg = "";
  try { await signOut(fauth); } catch(e){}
  if (location.hash.startsWith("#/admin")) location.hash = "#/";
  toast("로그아웃했어요");
}

function vAdmin(tab){
  if (!S.loaded) return `<div class="wrap done"><p class="muted">불러오는 중…</p></div>`;
  if (!S.authed) return vLogin();
  tab = tab || "orders";
  const newOrders = S.allOrders.filter(o => o.status === "입금대기").length;
  const newInq = S.inquiries.filter(q => q.status === "새 문의").length;
  const nav = [["orders","주문",newOrders],["products","상품"],["inquiries","문의",newInq],["slides","메인 슬라이드"],["profile","무용가 정보"],["performances","공연 기록"],["news","소식, 언론"],["videos","영상"],["gallery","갤러리"],["projects","프로젝트"],["meta","메타 태그"],["account","보안, 계정"]];
  let body;
  if (tab === "orders") body = adminOrders();
  else if (tab === "inquiries") body = adminInquiries();
  else if (tab === "profile") body = adminProfile();
  else if (tab === "account") body = adminAccount();
  else if (tab === "meta") body = adminMeta();
  else if (SCHEMA[tab]) body = adminCollection(tab);
  else body = "";
  return `<div class="wrap page-head" style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap"><div><h1>관리자</h1><p>여기서 바꾼 내용은 저장하는 즉시 사이트에 반영돼요.</p></div><div class="btn-row"><button class="btn ghost sm" data-act="logout">로그아웃</button></div></div>
  <div class="wrap admin"><nav class="admin-nav" aria-label="관리 메뉴">${nav.map(([k, l, n]) => `<a href="#/admin/${k}" class="${tab === k ? "on" : ""}"><span>${l}</span>${n ? `<b>${n}</b>` : ""}</a>`).join("")}</nav><div>${body}</div></div>`;
}

function adminCollection(col){
  const sch = SCHEMA[col];
  if (S.edit && S.edit.col === col){
    const d = draft("edit");
    return `<div class="sec-head" style="margin-bottom:20px"><h2>${sch.label} ${S.edit.id ? "수정" : "등록"}</h2><button class="btn ghost sm" data-act="cancel-edit">목록으로</button></div>
    <form class="form" data-form="admin-save" data-col="${col}" data-draft="edit" novalidate>${sch.fields.map(f => fieldHtml(f, d, "edit")).join("")}
    <div class="fld wide" style="flex-direction:row;gap:8px"><button class="btn" type="submit" ${S.busy || S.uploading ? "disabled" : ""}>${S.busy ? "저장하는 중…" : "저장"}</button><button class="btn ghost" type="button" data-act="cancel-edit">취소</button></div></form>`;
  }
  const list = S[col];
  const title = sch.title || (x => x.title || x.name);
  return `<div class="sec-head" style="margin-bottom:20px"><h2>${sch.label} <span class="muted" style="font-size:1rem">${list.length}</span></h2><button class="btn sm" data-act="new" data-col="${col}">새 ${sch.label} 등록</button></div>
  ${list.length ? `<div class="alist">${list.map(x => `<div class="arow"><div class="at">${sch.thumb ? imgOr(sch.thumb(x), x.id, "") : `<div style="display:grid;place-items:center;height:100%;color:var(--muted)">${col === "videos" ? "▶" : "글"}</div>`}</div>
    <div><div class="an">${esc(title(x))}</div><div class="as">${esc(sch.sub(x))}</div></div>
    <div class="aa"><button class="btn ghost sm" data-act="edit" data-col="${col}" data-id="${esc(x.id)}">수정</button><button class="btn ghost sm" data-act="del" data-col="${col}" data-id="${esc(x.id)}" style="${S.confirmDel === x.id ? "color:var(--kasa);border-color:var(--kasa)" : ""}">${S.confirmDel === x.id ? "한 번 더 눌러 삭제" : "삭제"}</button></div></div>`).join("")}</div>`
  : `<div class="empty">아직 등록된 ${sch.label}이 없어요. 오른쪽 위 버튼으로 첫 ${sch.label}을 등록해 보세요.</div>`}`;
}

function adminProfile(){
  const d = draft("profile", S.profile);
  return `<div class="sec-head" style="margin-bottom:20px"><h2>사이트 정보</h2></div><p class="muted">아티스트 프로필, 연락처, 입금 계좌를 관리해요.</p>

}

  const list = S.allOrders;
  const sales = list.filter(o => DEDUCTED.includes(o.status)).reduce((s, o) => s + o.total, 0);
  return `<div class="sec-head" style="margin-bottom:20px"><h2>주문 <span class="muted" style="font-size:1rem">${list.length}</span></h2><span class="muted">결제 확정 매출 ${won(sales)}</span></div>
  <p class="hint" style="margin-bottom:14px">상태를 '결제완료' 이후 단계로 바꾸면 재고가 차감되고, '취소'나 '입금대기'로 되돌리면 재고가 복구돼요. 입금을 확인할 때는 금액이 주문 금액과 같은지 꼭 확인해 주세요.</p>
  ${list.length ? `<div class="scroll-x"><table class="otable"><thead><tr><th>주문일</th><th>주문자, 배송지</th><th>상품</th><th>금액</th><th>상태</th></tr></thead><tbody>${list.map(o => `<tr>
    <td>${fmtDate(o.createdAt)}<br><span class="muted" style="font-size:.8rem">${esc(o.id)}</span></td>
    <td><b>${esc(o.buyer.name)}</b> ${esc(o.buyer.phone)}<br><span class="muted" style="font-size:.85rem">${esc([o.buyer.zip, o.buyer.address, o.buyer.address2].filter(Boolean).join(" "))}${o.buyer.memo ? `<br>메모: ${esc(o.buyer.memo)}` : ""}${o.buyer.email ? `<br>${esc(o.buyer.email)}` : ""}</span></td>
    <td>${(o.items || []).map(i => `${esc(i.name)} × ${i.qty}`).join("<br>")}</td><td>${won(o.total)}${(() => { const e = expectedTotal(o); return e !== null && e !== o.total ? `<br><span style="color:var(--kasa);font-size:.8rem">현재 가격 기준 ${won(e)}, 입금 금액 확인 필요</span>` : ""; })()}</td>
    <td><label><span class="sr">주문 상태</span><select data-act-change="ostatus" data-oid="${esc(o.id)}" style="padding:6px">${ORDER_STATUS.map(s => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select></label></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">아직 들어온 주문이 없어요.</div>`}`;

  const L = {type:"종류",rep:"희망 레퍼토리",org:"기관, 회사",name:"이름",phone:"연락처",email:"이메일",eventDate:"희망 일자",place:"장소",audience:"예상 인원",budget:"예산",link:"참고 링크",message:"내용"};

    <label><span class="sr">처리 상태</span><select data-act-change="qstatus" data-qid="${esc(q.id)}" style="padding:4px 8px">${["새 문의","확인함","답변 완료"].map(s => `<option ${s === q.status ? "selected" : ""}>${s}</option>`).join("")}</select></label></div>

/* ---------- modal ---------- */

  const m = S.modal; if (!m) return "";
  if (m.type === "video"){
    const v = S.videos.find(x => x.id === m.id); const id = v && ytId(v.url); if (!id) return "";
    return `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(v.title)}" data-act="close-bg"><div class="modal-in"><div class="modal-top"><button data-act="close">닫기</button></div>
      <div class="vframe"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="${esc(v.title)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
      <div style="padding:14px 4px 4px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b class="serif">${esc(v.title)}</b><div class="muted" style="font-size:.88rem">${fmtDate(v.date)}${v.venue ? `, ${esc(v.venue)}` : ""}</div>${v.description ? `<p style="margin-top:8px;font-size:.93rem">${esc(v.description)}</p>` : ""}</div>
      <a class="btn ghost sm" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">YouTube에서 열기</a></div></div></div>`;
  }
  if (m.type === "img"){
    const g = S.gallery[m.i]; if (!g) return "";

      <img src="${blob(g.image)}" alt="${esc(g.caption || "")}"><p>${esc(g.caption || "")}</p></div></div>`;
  }
  return "";

/* ---------- render ---------- */
function view(){
  const [r, a] = route();
  switch (r){
    case "": return vHome();
    case "about": return vAbout();
    case "artist": return vArtist();
    case "sources": return vSources();
    case "privacy": return vPrivacy();
    case "portfolio": return vPortfolio(a);
    case "store": return vStore();
    case "product": return vProduct(a);
    case "cart": return vCart();
    case "checkout": return vCheckout();
    case "order": return vOrderDone(a);
    case "orders": return vOrders();
    case "news": return vNews(a);
    case "contact": return vContact(a);
    case "admin": return vAdmin(a);
    default: return vHome();
  }
}
function render(){
  S.pending = false;
  $("#hdr").innerHTML = vHeader();
  $("#main").innerHTML = view();
  $("#ftr").innerHTML = vFooter();
  $("#modal").innerHTML = vModal();
  document.body.style.overflow = S.modal ? "hidden" : "";
  if (S.totpSecret && document.getElementById("qrbox")) drawQr();
}
function softRender(){
  const ae = document.activeElement;
  if (ae && $("#main").contains(ae) && ae.matches("input,textarea,select")){ S.pending = true; $("#hdr").innerHTML = vHeader(); return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (S.pending) softRender(); }, 0));
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

window.addEventListener("hashchange", () => {
  const h = location.hash;
  if (h !== lastRoute){ S.menuOpen = false; S.modal = null; S.confirmDel = null; if (!h.startsWith("#/admin")) S.edit = null; }
  render();
  if (h.split("/").slice(0, 2).join("/") !== lastRoute.split("/").slice(0, 2).join("/") || route()[0] === "product" || route()[0] === "news") window.scrollTo(0, 0);
  lastRoute = h;
});

/* ---------- slideshow ---------- */
function goSlide(n){
  const els = document.querySelectorAll(".hero-slides .slide"); const len = els.length; if (!len) return;
  S.slide = ((n % len) + len) % len;
  els.forEach((el, i) => { el.classList.toggle("on", i === S.slide); if (i === S.slide) el.removeAttribute("aria-hidden"); else el.setAttribute("aria-hidden", "true"); });
  document.querySelectorAll(".slide-dots button").forEach((b, i) => { b.classList.toggle("on", i === S.slide); if (i === S.slide) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
}
let slideTimer = null, slideHover = false;
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function restartSlides(){
  clearInterval(slideTimer);
  if (S.slidePaused || reducedMotion()) return;
  slideTimer = setInterval(() => { if (!slideHover && !document.hidden) goSlide(S.slide + 1); }, 6000);
}
document.addEventListener("mouseover", e => { slideHover = !!e.target.closest(".hero-slides"); });
document.addEventListener("focusin", e => { if (e.target.closest(".slide-ctrl")) slideHover = true; });

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "close-bg" && e.target !== el) return;
  if (["new","edit","del","imgrm","cancel-edit"].includes(act) && !S.authed) return;
  switch (act){
    case "menu": S.menuOpen = !S.menuOpen; render(); break;
    case "gorep": e.preventDefault(); location.hash = "#/about"; setTimeout(() => document.getElementById("rep-" + id)?.scrollIntoView(), 60); break;
    case "logout": logout(); break;
    case "mfa-start": mfaStart(); break;
    case "verify-send": verifySend(); break;
    case "verify-check": verifyCheck(); break;
    case "seed": if (!S.authed) break; if (!S.confirmSeed){ S.confirmSeed = true; render(); break; } S.confirmSeed = false; loadSeed(); break;
    case "login-reset": S.authStep = "login"; S.mfaResolver = null; S.authMsg = ""; render(); break;
    case "pw-reset-login": pwReset((document.getElementById("li-email") || {}).value || ""); break;
    case "pw-reset-me": pwReset(S.authUser && S.authUser.email); break;
    case "slide": goSlide(S.slide + Number(el.dataset.d)); restartSlides(); break;
    case "slideto": goSlide(Number(el.dataset.i)); restartSlides(); break;
    case "slidepause": S.slidePaused = !S.slidePaused; render(); restartSlides(); break;
    case "jump": { const t = document.getElementById(id); if (t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); break; }
    case "video": S.modal = {type: "video", id}; render(); $("#modal button")?.focus(); break;
    case "img": S.modal = {type: "img", i: Number(el.dataset.i)}; render(); $("#modal button[data-act=close]")?.focus(); break;
    case "gstep": { const n = S.gallery.length; S.modal.i = (S.modal.i + Number(el.dataset.d) + n) % n; render(); break; }
    case "close": case "close-bg": S.modal = null; render(); break;
    case "vcat": S.videoCat = el.dataset.v; render(); break;
    case "ntype": S.newsType = el.dataset.v; render(); break;
    case "pdimg": S.pdImg[id] = Number(el.dataset.i); render(); break;
    case "qty": { const p = findP(id); let q = (S.qty[id] || 1) + Number(el.dataset.d); q = Math.max(1, tracked(p) ? Math.min(q, Number(p.stock)) : Math.min(q, 99)); S.qty[id] = q; render(); break; }
    case "addcart": if (addToCart(id, S.qty[id] || 1)){ toast("장바구니에 담았어요"); render(); } break;
    case "buynow": if (addToCart(id, S.qty[id] || 1)) location.hash = "#/cart"; break;
    case "cq": { const l = S.cart.find(x => x.pid === id); const p = findP(id); if (!l) break; l.qty = Math.max(1, l.qty + Number(el.dataset.d)); if (p && tracked(p)) l.qty = Math.min(l.qty, Math.max(1, Number(p.stock))); saveCart(); render(); break; }
    case "crm": S.cart = S.cart.filter(x => x.pid !== id); saveCart(); render(); break;
    case "new": S.edit = {col: el.dataset.col, id: null}; S.drafts.edit = el.dataset.col === "products" ? {status: "판매중", images: []} : {}; render(); window.scrollTo(0, 0); break;
    case "edit": { const x = S[el.dataset.col].find(y => y.id === id); S.edit = {col: el.dataset.col, id}; const dd = clone(x); delete dd.id; S.drafts.edit = dd; render(); window.scrollTo(0, 0); break; }
    case "cancel-edit": S.edit = null; S.drafts.edit = null; render(); break;
    case "del":
      if (S.confirmDel !== id){ S.confirmDel = id; render(); break; }
      try { await FS.doc(el.dataset.col + "/" + id).delete(); toast("삭제했어요"); } catch(err){ toast("삭제하지 못했어요. 권한을 확인해 주세요."); }
      S.confirmDel = null; render(); break;
    case "imgrm": { const key = el.closest("[data-draft]").dataset.draft, d = S.drafts[key], k = el.dataset.k; if (Array.isArray(d[k])) d[k].splice(Number(el.dataset.i), 1); else d[k] = ""; render(); break; }
  }
});
document.addEventListener("keydown", e => {
  if (!S.modal) return;
  if (e.key === "Escape"){ S.modal = null; render(); }
  if (S.modal && S.modal.type === "img" && (e.key === "ArrowRight" || e.key === "ArrowLeft")){ const n = S.gallery.length; S.modal.i = (S.modal.i + (e.key === "ArrowRight" ? 1 : -1) + n) % n; render(); }
});
function bindDraft(e){
  const f = e.target.closest("[data-draft]"); const name = e.target.name;
  if (!f || !name || e.target.type === "password") return;
  const d = draft(f.dataset.draft);
  d[name] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
}
document.addEventListener("input", bindDraft);
document.addEventListener("change", async e => {
  bindDraft(e);
  const t = e.target;
  if (t.dataset.actChange === "ssort"){ S.storeSort = t.value; render(); }
  else if (["ostatus","qstatus"].includes(t.dataset.actChange) && !S.authed) return;
  else if (t.dataset.actChange === "ostatus") await setOrderStatus(t.dataset.oid, t.value);
  else if (t.dataset.actChange === "qstatus") await setInqStatus(t.dataset.qid, t.value);
  else if (t.dataset.upload && S.authed) await uploadImages(t);
});
document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === "checkout") placeOrder(f);
  else if (kind === "contact") sendInquiry(f);
  else if ((kind === "admin-save" || kind === "profile-save") && !S.authed) return;
  else if (kind === "admin-save") saveItem(f.dataset.col, f);
  else if (kind === "profile-save") saveProfile(f);
  else if (kind === "meta-save"){ if (S.authed) saveMeta(f); }
  else if (kind === "admin-login") adminLogin(f);
  else if (kind === "mfa-signin") mfaSignin(f);
  else if (kind === "mfa-enroll") mfaEnroll(f);
});
function firstInvalid(form, extra){
  const bad = [...form.querySelectorAll("[required]")].find(x => !String(x.value).trim());
  if (bad){ bad.focus(); toast(`${bad.closest(".fld")?.querySelector("label")?.textContent.replace("*", "").trim() || "필수 항목"}을(를) 입력해 주세요`); return true; }
  if (extra) return extra();
  return false;
}

/* ---------- actions ---------- */
async function placeOrder(form){
  if (firstInvalid(form, () => { if (!draft("checkout").agree){ toast("주문 내용 확인과 개인정보 동의에 체크해 주세요"); return true; } })) return;
  if (!S.online || !S.uid){ toast("잠시 후 다시 시도해 주세요. 연결을 준비하고 있어요."); return; }
  const ls = cartLines();
  for (const l of ls){ if (soldOut(l.p) || (tracked(l.p) && l.qty > Number(l.p.stock))){ toast(`'${l.p.name}' 재고가 부족해요. 장바구니를 확인해 주세요.`); return; } }
  const d = draft("checkout"), t = totals(ls);
  const now = new Date();
  const no = "SM" + now.getFullYear().toString().slice(2) + String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0") + "-" + Array.from(crypto.getRandomValues(new Uint8Array(4)), b => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("");
  const cut = (v, n) => String(v || "").slice(0, n);
  const order = {
    uid: S.uid,
    items: ls.map(l => ({pid: l.pid, name: cut(l.p.name, 100), price: unit(l.p), qty: l.qty})),
    subtotal: t.sub, shipping: t.ship, total: t.total,
    buyer: {name: cut(d.name, 50), phone: cut(d.phone, 30), email: cut(d.email, 100), zip: cut(d.zip, 10), address: cut(d.address, 200), address2: cut(d.address2, 200), memo: cut(d.memo, 300)},
    pay: "무통장입금", status: "입금대기", stockDeducted: false, createdAt: Date.now()
  };
  S.busy = true; render();
  try {
    await FS.doc("orders/" + no).set(order);
    S.cart = []; saveCart(); S.drafts.checkout = null;
    S.busy = false; location.hash = "#/order/" + no;
  } catch(err){ S.busy = false; render(); toast("주문을 보내지 못했어요. 잠시 후 다시 시도해 주세요."); }
}

/* image: resize in the browser before upload (max 2400px, JPEG) */
function shrink(file, max = 2400, q = 0.86){
  return new Promise(resolve => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      if (r === 1 && file.size < 1.5 * 1024 * 1024){ URL.revokeObjectURL(url); return resolve(file); }
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b || file), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function uploadImages(input){
  if (!S.canUpload){ toast("이미지를 올릴 권한이 없어요"); return; }
  const key = input.closest("[data-draft]").dataset.draft, k = input.dataset.upload, multi = input.dataset.multi === "1";
  const files = [...input.files]; if (!files.length) return;
  S.uploading = k; render();
  const d = draft(key);
  try {
    for (const file of (multi ? files : files.slice(0, 1))){
      if (!/^image\//.test(file.type)){ toast(`${file.name}: 이미지 파일만 올릴 수 있어요`); continue; }
      if (file.size > 20 * 1024 * 1024){ toast(`${file.name}: 20MB 이하 이미지만 올릴 수 있어요`); continue; }
      const out = await shrink(file);
      const ext = out.type === "image/png" ? "png" : out.type === "image/webp" ? "webp" : out.type === "image/gif" ? "gif" : "jpg";
      const r = storageRef(fstore, `images/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`);
      await uploadBytes(r, out, {contentType: out.type || "image/jpeg", cacheControl: "public, max-age=31536000"});
      const url = await getDownloadURL(r);
      if (multi){ d[k] = Array.isArray(d[k]) ? d[k] : []; d[k].push(url); } else d[k] = url;
    }
  } catch(err){ toast("이미지를 올리지 못했어요" + (err && err.code ? ` (${err.code})` : "")); }
  S.uploading = null; render();
}

async function saveItem(col, form){
  if (firstInvalid(form)) return;
  const sch = SCHEMA[col], d = draft("edit");
  const miss = sch.fields.find(f => f.req && (f.t === "image") && !d[f.k]);
  if (miss){ toast(`${miss.l}을(를) 올려 주세요`); return; }
  const data = {};
  for (const f of sch.fields){
    let v = d[f.k];
    if (f.t === "number") v = (v === "" || v == null) ? null : Math.max(0, Math.round(Number(v)));
    else if (f.t === "images") v = Array.isArray(v) ? v : [];
    else v = v == null ? "" : String(v).trim();
    data[f.k] = v;
  }
  if (col === "videos" && !ytId(data.url)){ toast("YouTube 링크 형식을 확인해 주세요"); return; }
  S.busy = true; render();
  try {
    if (S.edit.id){ const old = S[col].find(x => x.id === S.edit.id) || {}; await FS.doc(col + "/" + S.edit.id).set({...data, createdAt: old.createdAt || Date.now(), updatedAt: Date.now()}); }
    else await FS.collection(col).add({...data, createdAt: Date.now(), updatedAt: Date.now()});
    S.edit = null; S.drafts.edit = null; toast("저장했어요");
  } catch(err){ toast("저장하지 못했어요. 다시 로그인한 뒤 시도해 주세요."); }
  S.busy = false; render();
}

async function saveProfile(form){
  if (firstInvalid(form)) return;
  const d = draft("profile"), data = {};
  PROFILE_FIELDS.forEach(f => data[f.k] = d[f.k] == null ? "" : String(d[f.k]).trim());
  S.busy = true; render();
  try { await FS.doc("site/profile").set({...data, updatedAt: Date.now()}); toast("저장했어요"); }
  catch(err){ toast("저장하지 못했어요. 다시 로그인한 뒤 시도해 주세요."); }
  S.busy = false; S.drafts.profile = null; render();
}

async function setOrderStatus(oid, status){
  try {
    const snap = await FS.doc("orders/" + oid).get(); if (!snap.exists) return;
    const o = snap.data();
    let delta = 0, stockDeducted = !!o.stockDeducted;
    if (DEDUCTED.includes(status) && !stockDeducted){ delta = -1; stockDeducted = true; }
    else if (!DEDUCTED.includes(status) && stockDeducted){ delta = 1; stockDeducted = false; }
    await FS.doc("orders/" + oid).update({status, stockDeducted, updatedAt: Date.now()});
    if (delta){
      for (const it of o.items || []){
        const p = findP(it.pid);
        if (p && tracked(p)) await FS.doc("products/" + p.id).update({stock: Math.max(0, Number(p.stock) + delta * it.qty)});
      }
    }
    toast(`주문 상태를 '${status}'(으)로 바꿨어요${delta < 0 ? ", 재고 차감" : delta > 0 ? ", 재고 복구" : ""}`);
  } catch(err){ toast("상태를 바꾸지 못했어요"); }
}
async function setInqStatus(qid, status){
  try { await FS.doc("inquiries/" + qid).update({status}); toast("처리 상태를 바꿨어요"); }
  catch(err){ toast("상태를 바꾸지 못했어요"); }
}
/* the price a customer saw vs. the current catalogue — flags tampered or stale totals */
function expectedTotal(o){
  let sub = 0;
  for (const it of o.items || []){ const p = findP(it.pid); if (!p) return null; sub += unit(p) * (Number(it.qty) || 0); }
  return sub + (sub === 0 || sub >= FREE_SHIP ? 0 : SHIP);
}

/* ---------- data ---------- */
const SORTERS = {
  products: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
  videos: (a, b) => String(b.date || "").localeCompare(String(a.date || "")),
  gallery: (a, b) => String(b.date || "").localeCompare(String(a.date || "")) || (b.createdAt || 0) - (a.createdAt || 0),
  slides: (a, b) => (Number(a.order ?? 999) - Number(b.order ?? 999)) || ((a.createdAt || 0) - (b.createdAt || 0)),
  performances: (a, b) => String(b.date || "").localeCompare(String(a.date || "")),
  projects: (a, b) => String(b.year || "").localeCompare(String(a.year || "")),
  news: (a, b) => String(b.date || "").localeCompare(String(a.date || ""))
};
async function boot(){
  render();
  if (!S.online){ S.loaded = true; render(); return; }
  let pendingCols = Object.keys(SORTERS).length + 1;
  const done = () => { if (--pendingCols <= 0 && !S.loaded){ S.loaded = true; } };
  Object.keys(SORTERS).forEach(c => {
    FS.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({id: d.id, ...d.data()})).sort(SORTERS[c]); done(); softRender(); }, () => { done(); softRender(); });
  });
  FS.doc("site/profile").onSnapshot(s => { S.profile = s.exists ? s.data() : {}; done(); applyMeta(); softRender(); }, () => { done(); softRender(); });
  FS.doc("site/meta").onSnapshot(s => { S.meta = s.exists ? s.data() : {}; applyMeta(); }, () => {});
  let myUnsub = null;
  onAuthStateChanged(fauth, async u => {
    S.authUser = u; S.uid = u ? u.uid : null;
    S.isAdmin = !!u && !u.isAnonymous && ADMIN_UIDS.includes(u.uid);
    S.mfaEnrolled = !!u && !u.isAnonymous && multiFactor(u).enrolledFactors.length > 0;
    S.mfaOk = false;
    if (S.isAdmin){ try { const tok = await u.getIdTokenResult(); S.mfaOk = !!(tok.claims.firebase && tok.claims.firebase.sign_in_second_factor); } catch(e){} }
    if (myUnsub){ myUnsub(); myUnsub = null; } S.myOrders = [];
    if (u) myUnsub = FS.where("orders", "uid", u.uid).onSnapshot(snap => { S.myOrders = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); softRender(); }, () => {});
    const ok = S.isAdmin && (!REQUIRE_MFA || S.mfaOk);
    if (ok && !S.authed){ S.authed = true; startAdmin(); }
    else if (!ok && S.authed) stopAdmin();
    if (!u) signInAnonymously(fauth).catch(() => {});
    render();
  });
  setTimeout(() => { if (!S.loaded){ S.loaded = true; softRender(); } }, 6000);
}
lastRoute = location.hash;
restartSlides();
boot();
})();
