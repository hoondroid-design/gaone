<style>
:root{
  --paper:#0B0B0A; --surface:#161615; --ink:#ECEAE4; --muted:#8F8D87; --line:#2B2B29;
  --kasa:#D25A5C; --brass:#B39C68; --on-ink:#0B0B0A;
  color-scheme:dark;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --wrap:1180px; --hdr:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kasa);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.serif{font-family:var(--serif)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.3;margin:0}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}
h3{font-size:1.2rem}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:24px;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:600;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;flex-direction:column;align-items:center;text-decoration:none;padding:6px 12px;line-height:1.2;border-radius:2px}
.nav a span{font-size:.9rem;font-weight:500}
.nav a small{font-size:.7rem;color:var(--muted)}
.nav a.on span{color:var(--kasa)}
.nav a:hover{background:var(--surface)}
.hdr-tools{display:flex;gap:8px;align-items:center}
.cart-btn{display:flex;gap:6px;align-items:center;text-decoration:none;font-size:.9rem;padding:8px 12px;border:1px solid var(--line);border-radius:999px}
.cart-btn b{background:var(--ink);color:var(--on-ink);border-radius:999px;font-size:.72rem;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.hdr-tools:empty{display:none}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;top:var(--hdr);left:0;right:0;flex-direction:column;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 18px 16px}
  .nav.open{display:flex}
  .nav a{flex-direction:row;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
  .hdr-tools{margin-left:auto}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);text-decoration:none;cursor:pointer;font-weight:500;border-radius:2px;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.kasa{background:#A6383B;border-color:#A6383B;color:#fff}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}

/* hero */
.hero{position:relative;min-height:calc(100svh - var(--hdr));display:flex;flex-direction:column;justify-content:flex-end;padding-top:clamp(28px,6vw,72px);padding-bottom:clamp(40px,7vw,88px);overflow:hidden}
.hero-copy{position:relative;z-index:2;max-width:min(100%,70rem)}
.hero-h{font-family:var(--serif);font-weight:600;font-size:clamp(1.85rem,5.2vw,4.4rem);line-height:1.28;letter-spacing:-.01em;margin:0 0 .6em;text-wrap:balance}
.hero-copy .who{margin:0 0 .4em;font-size:clamp(1rem,1.6vw,1.15rem);line-height:1.6}
.hero-copy .who b{font-family:var(--serif);font-weight:600;font-size:1.15em}
.hero-copy .who .en{color:var(--muted);margin-left:10px;font-size:.9em}
.hero-copy .reps-line{color:var(--muted);font-size:.92rem;margin-bottom:1.6em}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:700px){.hero{min-height:calc(88svh - var(--hdr))}}

.hero-slides{position:relative;height:calc(100svh - var(--hdr));min-height:520px;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.slide figcaption{position:absolute;right:clamp(18px,4vw,40px);top:20px;font-size:.8rem;color:rgba(236,234,228,.75)}
.slide-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.1) 100%),linear-gradient(to right,rgba(0,0,0,.5),transparent 55%);pointer-events:none}
.slide-inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-top:clamp(28px,6vw,64px);padding-bottom:clamp(76px,9vw,108px)}
.slide-ctrl{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:22px;display:flex;align-items:center;gap:10px}
.slide-ctrl > button{background:rgba(0,0,0,.45);color:var(--ink);border:1px solid rgba(236,234,228,.35);padding:7px 14px;min-height:34px;font-size:.8rem;cursor:pointer;border-radius:999px}
.slide-dots{display:flex;gap:6px}
.slide-dots{gap:0}
.slide-dots button{width:26px;height:26px;padding:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.slide-dots button::before{content:"";width:8px;height:8px;border-radius:50%;border:1px solid var(--ink)}
.slide-dots button.on::before{background:var(--ink)}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
@media (max-width:700px){.hero-slides{height:calc(88svh - var(--hdr));min-height:460px}.slide-shade{background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.15) 100%)}.slide figcaption{top:12px;font-size:.72rem}}
/* sections */
.sec{padding:clamp(56px,8vw,104px) 0;border-top:1px solid var(--line)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.sec-head p{margin:6px 0 0;color:var(--muted)}
.page-head{padding-top:clamp(40px,6vw,72px);padding-bottom:28px}
.page-head h1{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:600}
.page-head p{color:var(--muted);margin-top:10px;max-width:40rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.tabs a,.tabs button{padding:8px 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:none;cursor:pointer;font-size:.9rem}
.tabs .on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.empty{border:1px dashed var(--line);padding:40px 24px;text-align:center;color:var(--muted);border-radius:2px}
.prose{max-width:40rem;font-size:1.02rem}
.prose p{line-height:1.85}
.grid{display:grid;gap:clamp(16px,2.4vw,28px)}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}

/* about */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(24px,5vw,72px)}
@media (max-width:820px){.story{grid-template-columns:1fr}}
.costumes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.costume{background:var(--paper);padding:26px}
.costume svg{width:96px;height:96px;margin-bottom:14px;color:var(--ink)}
.costume h3{margin-bottom:8px}
.costume h3 small{font-family:var(--sans);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:6px}
.costume p{color:var(--muted);font-size:.95rem;margin:0}
.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.flow li{padding:18px 18px 0 0;position:relative}
.flow li b{font-family:var(--serif);font-size:1.15rem;display:block;margin-bottom:4px}
.flow li .n{font-size:.8rem;color:var(--kasa)}
.flow li p{font-size:.92rem;color:var(--muted)}
.flow .peak b{color:var(--kasa)}
@media (max-width:760px){.flow{grid-template-columns:1fr 1fr;gap:12px 0}}
.drum-quote{font-family:var(--serif);font-size:clamp(1.3rem,2.6vw,1.8rem);line-height:1.6;border-left:3px solid var(--kasa);padding-left:20px;margin:0 0 24px}
.artist{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:clamp(24px,5vw,72px);align-items:start}
@media (max-width:820px){.artist{grid-template-columns:1fr}}
.artist-photo{aspect-ratio:3/4;background:var(--surface);overflow:hidden}
.artist-photo img,.artist-photo svg{width:100%;height:100%;object-fit:cover}
.artist h2{font-size:clamp(2rem,4vw,2.8rem)}
.artist .en{color:var(--muted);margin-top:4px}
.artist .badge{display:inline-block;margin-top:14px;padding:4px 10px;border:1px solid var(--kasa);color:var(--kasa);font-size:.85rem}
.cv{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:32px}
@media (max-width:600px){.cv{grid-template-columns:1fr}}
.cv h3{font-size:1rem;padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:10px}
.cv ul{list-style:none;padding:0;margin:0}
.cv li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}

.login{max-width:460px;padding-top:clamp(48px,8vw,96px);padding-bottom:96px}
.login h1{font-size:1.8rem;margin-bottom:10px}
.login .form{margin-top:24px}
.login-msg{color:var(--kasa);margin-top:14px;font-size:.92rem}
.artist-hero{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:clamp(24px,5vw,72px);padding-top:clamp(32px,6vw,72px);padding-bottom:clamp(48px,7vw,88px);align-items:start}
@media (max-width:820px){.artist-hero{grid-template-columns:1fr}}
.artist-hero h1{font-size:clamp(2.4rem,5.4vw,4rem);margin-top:6px}
.artist-hero .en{color:var(--muted);margin-top:4px}
.artist-hero .badge{display:inline-block;margin-top:14px;padding:4px 10px;border:1px solid var(--kasa);color:var(--kasa);font-size:.85rem}
.perf-year{display:grid;grid-template-columns:120px 1fr;gap:20px;border-top:1px solid var(--ink);padding-top:14px;margin-bottom:28px}
.perf-year h3{font-size:1.5rem}
@media (max-width:640px){.perf-year{grid-template-columns:1fr;gap:4px}}
.perf-list{list-style:none;padding:0;margin:0}
.perf{display:grid;grid-template-columns:100px 1fr auto;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.perf .pd8{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.perf-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.perf-tags i{font-style:normal;font-size:.78rem;border:1px solid var(--line);padding:1px 7px}
@media (max-width:640px){.perf{grid-template-columns:1fr}.perf-tags{justify-content:flex-start}}
.cv-block{display:grid;grid-template-columns:200px 1fr;gap:20px;border-top:1px solid var(--ink);padding-top:16px}
.cv-block + .cv-block{margin-top:44px}
.cv-block h2{font-size:1.25rem}
.cv-list{list-style:none;padding:0;margin:0}
.cv-list li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.cv-y{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:700px){.cv-block{grid-template-columns:1fr;gap:8px}.cv-list li{grid-template-columns:84px 1fr;gap:10px}}
.hero-awards{margin-top:32px;border-top:1px solid var(--ink);padding-top:14px}
.hero-awards h2{font-size:1.1rem;margin-bottom:6px}
.optbox{margin:4px 0 18px}
.optlabel{font-size:.9rem;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-width:56px;padding:10px 14px;border:1px solid var(--line);background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.opts button small{font-size:.7rem;color:var(--muted)}
.opts button.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.opts button.on small{color:var(--on-ink)}
.opts button:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.copt{font-size:.85rem;color:var(--ink);opacity:.85;margin-top:2px}
.lbl{font-size:.88rem;font-weight:500}
.optrows{display:flex;flex-direction:column;gap:8px}
.optrow{display:grid;grid-template-columns:1.2fr 1fr .8fr .9fr auto;gap:8px;align-items:center}
.opthead{font-size:.78rem;color:var(--muted)}
.optnum{font-variant-numeric:tabular-nums;display:flex;flex-direction:column;font-size:.92rem}
.optnum small{font-size:.72rem;color:var(--muted)}
.optnum.zero{color:var(--kasa)}
.stk{border-collapse:collapse;margin-top:6px;font-size:.8rem}
.stk th,.stk td{border:1px solid var(--line);padding:3px 8px;text-align:right;font-variant-numeric:tabular-nums}
.stk th:first-child,.stk td:first-child{text-align:left}
.stk th{color:var(--muted);font-weight:400}
.stk td.zero{color:var(--kasa)}
@media (max-width:560px){.optrow{grid-template-columns:1fr 1fr;}.opthead{display:none}}
.optrow input{padding:10px 12px;border:1px solid var(--line);background:var(--paper);border-radius:2px;width:100%}
.soldout.part{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.so-tag{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.04em;color:#fff;background:var(--kasa);padding:2px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.lookup-form{grid-template-columns:1fr 1fr 1fr auto;align-items:end;max-width:960px}
@media (max-width:860px){.lookup-form{grid-template-columns:1fr}}
.ono{font-size:1.3rem;letter-spacing:.04em}
.policy{border:1px solid var(--line);background:var(--surface);padding:12px 14px;font-size:.85rem;line-height:1.7;margin:16px 0}
.policy p{margin:0}
.pre-badge{display:inline-block;font-size:.8rem;border:1px solid var(--kasa);color:var(--kasa);padding:3px 8px;margin:0 0 14px}
.pre-tag{font-style:normal;font-size:.72rem;color:var(--kasa);border:1px solid var(--kasa);padding:0 5px;margin-left:4px;white-space:nowrap}
.consent{padding:10px 0;border-bottom:1px solid var(--line)}
.consent .check{grid-column:auto;align-items:flex-start}
.consent details{margin:6px 0 0 26px}
.consent summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
.consent-text{max-height:220px;overflow:auto;border:1px solid var(--line);padding:10px 12px;margin-top:6px;font-size:.85rem;line-height:1.7;background:var(--surface)}
.consent .hint{margin:4px 0 0 26px}
.req{color:var(--kasa)}
.opt{color:var(--muted)}
.ocards{display:grid;gap:14px;margin-top:24px}
.ocard{border:1px solid var(--line);padding:16px 18px}
.ocard-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ocard-h b{font-size:1.05rem;letter-spacing:.03em;margin-right:10px}
.ocard-items{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.ocard-items li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.ocard-sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:10px 0;font-size:.9rem}
.ocard-sum dt{color:var(--muted)}
.ocard-sum dd{margin:0;text-align:right}
.ocard-log summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
.ocard-log ul,.olog{list-style:none;padding:0;margin:6px 0 0}
.ocard-log li,.olog li{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:4px 0;font-size:.85rem}
.ocard-act{margin-top:12px;display:flex;justify-content:flex-end}
.nocancel{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);padding:6px 10px}
.ofilter{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.ofilter label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.ofilter label.grow{flex:1 1 200px}
.ofilter input,.ofilter select{padding:8px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:.9rem;min-height:38px}
.odetail td{background:var(--surface)}
.odg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;padding:6px 0}
.odg h4{font-size:.9rem;margin:0 0 8px;font-family:var(--sans)}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.86rem}
.kv2 dt{color:var(--muted)}
.kv2 dd{margin:0;text-align:right;word-break:break-all}
.kv2 dd:has(+ dt), .kv2 dd:last-child{white-space:nowrap}
.memo-box{grid-column:1/-1}
.memo-box textarea{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;resize:vertical}
.lock-tag,.memo-tag,.mkt-tag{display:inline-block;font-size:.7rem;padding:1px 6px;border:1px solid var(--line);color:var(--muted);font-weight:400;margin-left:6px;vertical-align:middle}
.mkt-tag{border-color:var(--brass);color:var(--brass);margin-left:0;margin-top:4px}
.memo-tag{margin-left:0;margin-top:4px}
.lockbox{border:1px solid var(--line);padding:22px;max-width:620px}
.lockbox .lock-title{font-family:var(--serif);font-size:1.15rem;margin:0 0 8px}
.cfm{max-width:460px;padding:22px}

const unit = p => (Number(p.salePrice) > 0 && Number(p.salePrice) < Number(p.price)) ? Number(p.salePrice) : Number(p.price) || 0;

const hasOpts = p => Array.isArray(p.options) && p.options.length > 0;

const findOpt = (p, name) => hasOpts(p) ? p.options.find(o => o.name === name) : null;
const optTracked = o => o && o.stock !== null && o.stock !== undefined && o.stock !== "";
const optSoldOut = o => optTracked(o) && Number(o.stock) <= 0;
const tracked = p => !hasOpts(p) && p.stock !== null && p.stock !== undefined && p.stock !== "";
const soldOut = p => p.status === "품절" || (hasOpts(p) ? p.options.every(optSoldOut) : (tracked(p) && Number(p.stock) <= 0));
/* how many of this product (and option) can still be bought; Infinity if not tracked */
function stockOf(p, optName){
  if (hasOpts(p)){ const o = findOpt(p, optName); if (!o) return 0; return optTracked(o) ? Math.max(0, Number(o.stock)) : Infinity; }
  return tracked(p) ? Math.max(0, Number(p.stock)) : Infinity;
}
const lineKey = l => l.pid + "|" + (l.opt || "");
/* 관리자용: 주문 기록에서 사이즈별 판매(입금완료 이후)와 입금대기 수량을 계산 */
function salesOf(pid, opt){
  let sold = 0, wait = 0;
  for (const o of S.allOrders || []){
    const st = normStatus(o.status);
    for (const i of o.items || []){
      if (i.pid !== pid || (i.opt || "") !== (opt || "")) continue;
      if (o.stockDeducted && DEDUCTED.includes(o.status)) sold += Number(i.qty) || 0;
      else if (st === "입금대기") wait += Number(i.qty) || 0;
    }
  }
  return {sold, wait};
}

}

function addToCart(pid, qty){

/* SNS: accepts a full URL or just "@handle"; hides placeholder home-page URLs */
function sns(p){
  const out = [];
  const add = (label, raw, base, trail) => {
    let v = String(raw || "").trim(); if (!v) return;
    if (!/^https?:\/\//i.test(v)){ v = v.replace(/^@/, ""); if (!/^[\w.\-]{1,60}$/.test(v)) return; v = base + (label === "YouTube" ? "@" : "") + v + trail; }
    let u; try { u = new URL(v); } catch(e){ return; }
    if (!/^https?:$/.test(u.protocol)) return;
    const path = u.pathname.replace(/\/+$/, "");
    if (!path) return;
    const last = decodeURIComponent(path.split("/").filter(Boolean).pop() || "");
    const handle = last.startsWith("@") ? last : (label === "Instagram" ? "@" + last : "");
    out.push({label, url: u.href, handle});
  };
  add("YouTube", p.youtube, "https://www.youtube.com/", "");
  add("Instagram", p.instagram, "https://www.instagram.com/", "/");
  return out;
}

const SITE_URL = () => String((S.meta && S.meta.canonical) || "https://www.gaoneway.com").replace(/\/+$/, "");
function eventLD(x){
  const t = x.time && /^\d{2}:\d{2}$/.test(x.time) ? `T${x.time}:00+09:00` : "";
  const ev = {"@context": "https://schema.org", "@type": "DanceEvent", name: x.title, startDate: x.date + t,
    eventStatus: "https://schema.org/EventScheduled", eventAttendanceMode: "https://schema.org/OfflineEventAttendanceMode",
    location: {"@type": "Place", name: x.venue || "", address: x.address || x.venue || ""},
    performer: {"@type": "Person", name: S.profile.name || ""},
    organizer: {"@type": "Organization", name: S.profile.siteTitle || S.profile.name || "", url: SITE_URL()},
    url: SITE_URL() + "/#/schedule/" + encodeURIComponent(x.id)};
  if (x.endDate && x.endDate !== x.date) ev.endDate = x.endDate + t;
  if (x.summary) ev.description = String(x.summary).slice(0, 500);
  if (x.poster) ev.image = [blob(x.poster)];
  if (x.ticketUrl && /^https?:\/\//i.test(x.ticketUrl)){ ev.offers = {"@type": "Offer", url: x.ticketUrl, availability: "https://schema.org/InStock", priceCurrency: "KRW"}; const n = String(x.price || "").replace(/[^0-9]/g, ""); if (n) ev.offers.price = n; else if (/무료/.test(x.price || "")) ev.offers.price = "0"; }
  return ev;
}
function applyEventsLD(){
  const list = allSchedules().filter(x => !isPast(x) && x.venue).slice(0, 20).map(eventLD);

  if (!el){ el = document.createElement("script"); el.type = "application/ld+json"; el.id = "ld-events"; document.head.appendChild(el); }

/* "2015  ○○ 입단" → year column + text */
function cvRows(text){
  return lines(text).map(l => {
    const m = l.match(/^((?:19|20)[\d○]{2}(?:\s*[.\-~–]\s*(?:(?:19|20)?[\d○]{2}(?:\.\d{1,2})?)?)?(?:\.\d{1,2})?)\s+(.+)$/);
    return m ? `<li><span class="cv-y">${esc(m[1])}</span><span>${esc(m[2])}</span></li>` : `<li><span class="cv-y"></span><span>${esc(l)}</span></li>`;
  }).join("");
}
function cvBlock(title, text){
  const r = cvRows(text);
  return r ? `<section class="cv-block"><h2>${title}</h2><ul class="cv-list">${r}</ul></section>` : "";
}
/* 공연 레퍼런스: 연도 / 공연명 / 비고 (관리자 표 입력). 예전 방식 기록은 표가 비어 있을 때만 보여 줌 */
const yearKey = y => { const m = String(y || "").match(/(19|20)\d{2}/); return m ? m[0] : (String(y || "").trim() || "기타"); };
function sortRefs(list){
  return list.map((r, i) => ({...r, _i: i})).sort((a, b) => { const ya = yearKey(a.year), yb = yearKey(b.year); return ya === yb ? a._i - b._i : (ya === "기타" ? 1 : yb === "기타" ? -1 : yb.localeCompare(ya)); }).map(({_i, ...r}) => r);
}
function perfRefsView(){
  const refs = Array.isArray(S.profile.perfRefs) ? S.profile.perfRefs.filter(r => String(r.title || "").trim()) : [];
  const src = refs.length ? refs : (S.performances || []).map(x => ({year: String(x.date || "").slice(0, 4), title: x.title, note: [x.venue, x.role].filter(Boolean).join(", ")}));
  return sortRefs(src).map(r => ({...r, yk: yearKey(r.year)}));
}

async function custCancel(no){
  const o = S.lookup && S.lookup.orders && S.lookup.orders[no]; if (!o || !o.sk || !S.lookupKeyUsed) return;
  const cur = normStatus(((S.lookupStatus || {})[no] || o).status);
  if (cur !== "입금대기"){ toast("이 주문은 취소할 수 없어요. 관리자에게 문의해 주세요."); return; }
  const at = Date.now(), entry = {s: "취소", at, by: "주문자"};
  S.busy = true; render();
  try {
    const b = writeBatch(fdb);
    b.update(doc(fdb, "orders/" + no), {status: "취소", statusLog: arrayUnion(entry), updatedAt: at, cancelKey: S.lookupKeyUsed, canceledBy: "주문자"});
    b.update(doc(fdb, "orderStatus/" + o.sk), {status: "취소", log: arrayUnion(entry), updatedAt: at});
    await withTimeout(b.commit());
    const prev = (S.lookupStatus || {})[no] || {log: [{s: "입금대기", at: o.createdAt}]};
    S.lookupStatus[no] = {status: "취소", log: [...(prev.log || []), entry]};
    toast("주문을 취소했어요");
  } catch(err){ toast(failMsg(err, "취소하지 못했어요.")); }
  S.busy = false; render();
}
async function doLookup(form){
  if ((S.lookupLock || 0) > Date.now()) return;
  const mode = S.lookupMode === "order" ? "order" : "phone";
  const name = normName(S.keep.lkname), pw = S.keep.lkpw || "";
  if (!name || !pw || (mode === "phone" ? !normPhone(S.keep.lkphone) : !normNo(S.keep.lkno))){ toast("세 칸을 모두 입력해 주세요"); return; }
  if (!S.online){ toast("잠시 후 다시 시도해 주세요"); return; }
  S.busy = true; S.lookup = null; render();
  try {
    const k = mode === "phone" ? await keyByPhone(S.keep.lkphone, name, pw) : await keyByOrder(name, S.keep.lkno, pw);
    const snap = await FS.doc("lookups/" + k).get();
    if (snap.exists){
      S.lookup = snap.data(); S.lookupFails = 0; S.lookupKeyUsed = k; S.lookupStatus = {};
      await Promise.all(Object.values(S.lookup.orders || {}).filter(o => o.sk).map(async o => {
        try { const st = await FS.doc("orderStatus/" + o.sk).get(); if (st.exists) S.lookupStatus[o.no] = st.data(); } catch(e){}
      }));
    }
    else {
      S.lookup = false; S.lookupFails = (S.lookupFails || 0) + 1;
      if (S.lookupFails >= 5){ S.lookupFails = 0; S.lookupLock = Date.now() + 5 * 60 * 1000; toast("5회 일치하지 않아 5분 동안 조회할 수 없어요"); setTimeout(render, 5 * 60 * 1000 + 50); }
    }
    S.keep.lkpw = "";
  } catch(err){ toast(failMsg(err, "조회하지 못했어요.")); }
  S.busy = false; render();
}

const META_FIELDS = [
  {k:"title",l:"사이트 제목 (title)",wide:1,hint:"검색 결과와 브라우저 탭에 보이는 제목. 30자 안팎을 권해요."},

  {k:"ogDescription",l:"공유 설명 (og:description)",t:"textarea",rows:2,wide:1},
  {k:"ogImage",l:"공유 이미지 (og:image)",t:"image",wide:1,hint:"1200×630px 가로 이미지를 권해요."},
  {k:"canonical",l:"대표 주소 (canonical URL)",wide:1,hint:"나중에 연결할 실제 도메인. 예: https://www.내도메인.kr"},
  {k:"naver",l:"네이버 서치어드바이저 인증 코드",wide:1,hint:"naver-site-verification의 content 값만 붙여 넣어요."},
  {k:"google",l:"구글 서치 콘솔 인증 코드",wide:1,hint:"google-site-verification의 content 값만 붙여 넣어요."},
  {k:"extra",l:"추가 메타 태그",t:"textarea",rows:4,wide:1,hint:"한 줄에 하나씩 '이름=값' 형식으로 적어요. 예: author=홍길동. 보안을 위해 meta 태그만 만들고, 스크립트나 다른 HTML은 받지 않아요."}
];
function metaList(m, absImg){
  const L = [];
  const add = (attr, key, val) => { if (String(val || "").trim()) L.push({attr, key, val: String(val).trim()}); };
  add("name", "description", m.description);
  add("name", "keywords", m.keywords);
  add("property", "og:type", m.title || m.description ? "website" : "");
  add("property", "og:title", m.ogTitle || m.title);
  add("property", "og:description", m.ogDescription || m.description);
  if (m.ogImage) add("property", "og:image", blob(m.ogImage));
  add("property", "og:url", m.canonical);
  add("name", "naver-site-verification", m.naver);
  add("name", "google-site-verification", m.google);
  lines(m.extra).forEach(l => { const i = l.indexOf("="); if (i > 0){ const k = l.slice(0, i).trim(); if (/^[a-zA-Z0-9:._-]{1,64}$/.test(k)) add(k.includes(":") ? "property" : "name", k, l.slice(i + 1)); } });
  return L;
}
function metaCode(m){
  const out = [];
  if (m.title) out.push(`<title>${esc(m.title)}</title>`);
  metaList(m, true).forEach(x => out.push(`<meta ${x.attr}="${esc(x.key)}" content="${esc(x.val)}">`));
  if (m.canonical) out.push(`<link rel="canonical" href="${esc(m.canonical)}">`);
  return out.join("\n");
}
function applyFavicon(){
  const u = blob(S.profile.favicon); if (!u) return;
  const set = (sel, attrs) => { let el = document.head.querySelector(sel); if (!el){ el = document.createElement("link"); document.head.appendChild(el); } Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); };
  document.head.querySelectorAll('link[rel="icon"]').forEach(el => el.remove());
  set('link[rel="icon"][data-fav]', {rel: "icon", type: "image/png", sizes: "512x512", href: u, "data-fav": "1"});
  set('link[rel="apple-touch-icon"]', {rel: "apple-touch-icon", href: u});
}
function applyMeta(){
  applyFavicon();
  const m = S.meta || {};
  if (m.title) document.title = m.title;
  metaList(m, false).forEach(x => {
    let el = document.head.querySelector(`meta[${x.attr}="${x.key}"]`);
    if (!el){ el = document.createElement("meta"); el.setAttribute(x.attr, x.key); document.head.appendChild(el); }
    el.setAttribute("content", x.val);
  });
}
function adminMeta(){

  <form class="form" data-form="meta-save" data-draft="meta" novalidate>${META_FIELDS.map(f => fieldHtml(f, d, "meta")).join("")}
  <div class="fld wide"><button class="btn" type="submit" ${S.busy || S.uploading ? "disabled" : ""}>${S.busy ? "저장하는 중…" : "저장하고 적용"}</button></div></form>

  <p class="hint" style="margin-top:8px">상자를 누르면 전체가 선택돼요. 이 코드를 index.html의 &lt;head&gt; 안, 기존 기본 메타 태그 자리에 바꿔 붙여 넣고 다시 올리면 네이버, 카카오톡처럼 자바스크립트를 실행하지 않는 수집기에도 반영돼요.</p></div>`;
}
async function saveMeta(form){
  const d = draft("meta"), data = {};
  META_FIELDS.forEach(f => data[f.k] = d[f.k] == null ? "" : String(d[f.k]).trim());
  if (data.canonical && !/^https:\/\//.test(data.canonical)){ toast("대표 주소는 https:// 로 시작해야 해요"); return; }
  S.busy = true; render();
  try { await FS.doc("site/meta").set({...data, updatedAt: Date.now()}); toast("메타 태그를 저장하고 적용했어요"); }
  catch(e){ toast(failMsg(e, "저장하지 못했어요.")); }
  S.busy = false; render();
}

async function mfaSignin(form){

function parseRefLines(text){
  const out = [];
  String(text || "").split(/\r?\n/).forEach(line => {
    const l = line.trim(); if (!l) return;
    let parts;
    if (l.includes("\t")) parts = l.split("\t");
    else if (l.includes("|")) parts = l.split("|");
    else { const m = l.match(/^((?:19|20)\d{2}(?:[.\-~]\s*\d{0,4})?)\s+(.+)$/); if (m){ const rest = m[2].split(/\s{2,}| \/ /); parts = [m[1], rest[0], rest.slice(1).join(" ")]; } else parts = ["", l, ""]; }
    const [year, title, ...note] = parts.map(x => String(x || "").trim());
    if (title) out.push({year: year || "", title: title.slice(0, 200), note: note.join(" ").trim().slice(0, 200)});
  });
  return out;
}

/* ---------- step-up re-authentication (개인정보 열람 전 재인증) ---------- */
const STEPUP_MS = 9 * 60 * 1000;
const stepUpValid = () => S.stepUpAt && Date.now() - S.stepUpAt < STEPUP_MS;
function requireStepUp(next, why){
  if (stepUpValid()){ next(); return; }
  S.keep.supw = ""; S.keep.sucode = ""; S.suResolver = null; S.suMsg = "";
  S.modal = {type: "stepup", why, next}; render(); setTimeout(() => document.getElementById("su-pw")?.focus(), 30);
}
function vStepUp(m){
  const step = S.suResolver ? "code" : "pw";
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="su-t"><div class="modal-in cfm">
    <h2 id="su-t">본인 확인</h2><p class="muted">${esc(m.why || "개인정보 보호를 위해 한 번 더 확인해요.")}</p>
    <form data-form="${step === "pw" ? "su-pw" : "su-code"}" novalidate style="margin-top:14px">
      ${step === "pw" ? `<div class="fld"><label for="su-pw">관리자 비밀번호</label><input id="su-pw" type="password" data-keep="supw" value="${esc(S.keep.supw || "")}" autocomplete="current-password" required></div>`
        : `<div class="fld"><label for="su-code">인증 앱 6자리 코드</label><input id="su-code" data-keep="sucode" value="${esc(S.keep.sucode || "")}" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>`}
      ${S.suMsg ? `<p class="login-msg" role="alert">${esc(S.suMsg)}</p>` : ""}
      <div class="btn-row" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn ghost" data-act="close">닫기</button><button class="btn" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "확인하는 중…" : step === "pw" ? "다음" : "확인"}</button></div>
    </form><p class="hint" style="margin-top:12px">확인 후 9분 동안 유지되고, 그 뒤에는 다시 확인해요.</p></div></div>`;
}
async function stepUpPw(){
  const pw = S.keep.supw || ""; if (!pw) return;
  S.busy = true; S.suMsg = ""; render();
  try { await reauthenticateWithCredential(fauth.currentUser, EmailAuthProvider.credential(fauth.currentUser.email, pw)); await stepUpDone(); }
  catch(e){
    if (e.code === "auth/multi-factor-auth-required"){ S.suResolver = getMultiFactorResolver(fauth, e); S.busy = false; render(); setTimeout(() => document.getElementById("su-code")?.focus(), 30); return; }
    S.suMsg = authMsg(e);
  }
  S.busy = false; S.keep.supw = ""; render();
}
async function stepUpCode(){
  const code = String(S.keep.sucode || "").replace(/\D/g, ""); const r = S.suResolver;
  if (code.length !== 6 || !r) { S.suMsg = "6자리 숫자를 입력해 주세요."; render(); return; }
  const hint = r.hints.find(h => h.factorId === TotpMultiFactorGenerator.FACTOR_ID);
  S.busy = true; S.suMsg = ""; render();
  try { await r.resolveSignIn(TotpMultiFactorGenerator.assertionForSignIn(hint.uid, code)); await stepUpDone(); }
  catch(e){ S.suMsg = authMsg(e); }
  S.busy = false; render();
}
async function stepUpDone(){
  try { await fauth.currentUser.getIdToken(true); } catch(e){}
  S.stepUpAt = Date.now(); S.suResolver = null; S.keep.supw = ""; S.keep.sucode = "";
  const next = S.modal && S.modal.next; S.modal = null; S.busy = false; render();
  if (next) await next();
}

/* ---------- 방문 통계 ----------
   방법 1: Firebase에 하루 단위 집계(statsDaily/YYYY-MM-DD)만 저장. 개인 식별 정보, 쿠키 없음.
   방법 2: 구글 애널리틱스(GA4). config.js의 measurementId가 있으면 자동 연결. */
const BOT_RE = /bot|crawl|spider|slurp|bingpreview|headless|lighthouse|facebookexternalhit|kakaotalk-scrap|yeti|daumoa|googleother|adsbot/i;
const isBot = () => navigator.webdriver || BOT_RE.test(navigator.userAgent || "");
const sKey = v => String(v || "").toLowerCase().replace(/[^a-z0-9가-힣_:.-]/g, "_").slice(0, 60);
function pageKey(){
  const [r, a] = route();
  if (!r) return "home";
  if (r === "product") return "product:" + sKey(a);
  if (r === "portfolio") return "portfolio_" + sKey(a || "video");
  if (r === "contact") return "contact_" + sKey(a || "performance");
  if (r === "checkout") return "checkout";
  return sKey(r);
}
function refKey(){
  const q = new URLSearchParams(location.search);
  const utm = q.get("utm_source"); if (utm) return "utm:" + sKey(utm);
  let host = ""; try { host = document.referrer ? new URL(document.referrer).hostname : ""; } catch(e){}
  if (!host || host === location.hostname) return "direct";
  const map = [["naver", /naver\./], ["google", /google\./], ["instagram", /instagram\.|l\.instagram/], ["facebook", /facebook\.|fb\.com/], ["kakao", /kakao/], ["youtube", /youtube\.|youtu\.be/], ["daum", /daum\.|kakaocorp/], ["bing", /bing\./], ["x", /twitter\.|t\.co$|x\.com/]];
  for (const [k, re] of map) if (re.test(host)) return k;
  return sKey(host.replace(/^www\./, ""));
}
const todayKST = () => fmtDT(Date.now()).slice(0, 10).replace(/\./g, "-");
let gaReady = false;
function gaInit(){
  const id = FIREBASE_CONFIG && FIREBASE_CONFIG.measurementId;
  if (!id || gaReady || isBot()) return;
  gaReady = true;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ window.dataLayer.push(arguments); };
  window.gtag("js", new Date());
  window.gtag("config", id, {send_page_view: false});
  const sc = document.createElement("script"); sc.async = true; sc.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id); document.head.appendChild(sc);
}
let lastTracked = "", trackQueue = [];
function trackView(){
  if (route()[0] === "admin" || S.authed || isBot()) return;
  const key = pageKey(); if (key === lastTracked) return; lastTracked = key;
  /* 방법 2: GA4 — 메뉴 주소를 보기 좋은 경로로 바꿔 전송 (#/about → /about) */
  if (gaReady){ const path = "/" + (location.hash.replace(/^#\/?/, "") || ""); try { window.gtag("event", "page_view", {page_location: location.origin + path + location.search, page_path: path, page_title: document.title}); } catch(e){} }
  /* 방법 1: Firebase 하루 집계 */
  if (!S.online) return;
  if (!S.uid){ trackQueue.push(key); return; }
  sendStat(key);
}
async function sendStat(key){
  const day = todayKST(), data = {pv: increment(1), paths: {[key]: increment(1)}, updatedAt: Date.now()};
  try { if (localStorage.getItem("gw-uv") !== day){ data.uv = increment(1); localStorage.setItem("gw-uv", day); } } catch(e){}
  try { if (!sessionStorage.getItem("gw-landed")){ data.refs = {[refKey()]: increment(1)}; sessionStorage.setItem("gw-landed", "1"); } } catch(e){}
  try { await FS.doc("statsDaily/" + day).merge(data); } catch(e){}
}
function flushTrack(){ const q = trackQueue; trackQueue = []; q.forEach(sendStat); }

/* ---------- slideshow ---------- */
function goSlide(n){
  const els = document.querySelectorAll(".hero-slides .slide"); const len = els.length; if (!len) return;
  S.slide = ((n % len) + len) % len;
  els.forEach((el, i) => { el.classList.toggle("on", i === S.slide); if (i === S.slide) el.removeAttribute("aria-hidden"); else el.setAttribute("aria-hidden", "true"); });
  document.querySelectorAll(".slide-dots button").forEach((b, i) => { b.classList.toggle("on", i === S.slide); if (i === S.slide) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
}
let slideTimer = null, slideHover = false;
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function restartSlides(){
  clearInterval(slideTimer);
  if (S.slidePaused || reducedMotion()) return;
  slideTimer = setInterval(() => { if (!slideHover && !document.hidden) goSlide(S.slide + 1); }, 4000);
}

/* ---------- order lookup keys ----------
   Customers look orders up with (phone + name + password) or (name + order no + password).
   Each combination is stretched with PBKDF2 into a document id under /lookups.
   The rules allow reading a lookup doc only by its exact id (no listing), so knowing
   all three values is the only way in. The password itself is never stored. */
const LOOKUP_SALT = "gaoneway-order-lookup-v1", LOOKUP_ITER = 150000;
const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
async function lookupKey(str){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(str), "PBKDF2", false, ["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name: "PBKDF2", salt: enc.encode(LOOKUP_SALT), iterations: LOOKUP_ITER, hash: "SHA-256"}, key, 256));
}
const normName = v => String(v || "").trim();
const normPhone = v => String(v || "").replace(/\D/g, "");
const normNo = v => String(v || "").trim().toUpperCase();
const keyByPhone = (phone, name, pw) => lookupKey(`P|${normPhone(phone)}|${normName(name)}|${pw}`);
const keyByOrder = (name, no, pw) => lookupKey(`O|${normName(name)}|${normNo(no)}|${pw}`);
function orderSummary(no, o){
  return {no, createdAt: o.createdAt, items: o.items.map(i => ({name: i.name, opt: i.opt || "", qty: i.qty, price: i.price, pre: !!i.pre})), subtotal: o.subtotal, shipping: o.shipping, total: o.total, status: o.status};
}

async function placeOrder(form){
  if (firstInvalid(form, () => {
    const d = draft("checkout"), phone = normPhone(d.phone), pw = S.keep.opw || "";
    if (!/^01\d{8,9}$/.test(phone)){ toast("휴대폰 번호를 숫자만 정확히 입력해 주세요 (예: 01012345678)"); return true; }
    if (pw.length < 6){ toast("주문 조회 비밀번호를 6자 이상 입력해 주세요"); return true; }
    if (pw !== (S.keep.opw2 || "")){ toast("주문 조회 비밀번호 확인이 일치하지 않아요"); return true; }
    const tpv = [...new Map(checkoutLines().map(l => [l.pid, l.p])).values()].filter(x => String(x.terms || "").trim());
    const miss = tpv.find(x => !d["terms_" + x.id]);
    if (miss){ toast(`[필수] ${miss.termsTitle || "구매 약관"} (${miss.name})에 동의해 주세요`); return true; }
    if (!d.agree){ toast("[필수] 주문 내용 확인과 개인정보 동의에 체크해 주세요"); return true; }
  })) return;
  if (!S.online || !S.uid){ toast("잠시 후 다시 시도해 주세요. 연결을 준비하고 있어요."); return; }
  const ls = checkoutLines(), fromBuyNow = isBuyNow();
  for (const l of ls){ if (lineBad(l)){ toast(`'${l.p.name}${l.opt ? " " + l.opt : ""}' 재고가 부족해요. 장바구니를 확인해 주세요.`); return; } }
  const d = draft("checkout"), t = totals(ls), pw = S.keep.opw;
  const now = new Date();
  const no = "SM" + now.getFullYear().toString().slice(2) + String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0") + "-" + Array.from(crypto.getRandomValues(new Uint8Array(4)), b => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("");
  const cut = (v, n) => String(v || "").slice(0, n);
  const name = cut(normName(d.name), 50), phone = normPhone(d.phone);
  S.busy = true; render();
  try {
    const [k1, k2] = await Promise.all([keyByPhone(phone, name, pw), keyByOrder(name, no, pw)]);
    const at = Date.now();
    const prods = [...new Map(ls.map(l => [l.pid, l.p])).values()];
    const consents = {
      privacy: {agreed: true, at},
      terms: prods.filter(x => String(x.terms || "").trim()).map(x => ({pid: x.id, product: cut(x.name, 100), title: cut(x.termsTitle || "구매 약관", 100), text: cut(x.terms, 5000), at})),
      marketing: (mktConsent() && d.mktAll) ? [{product: cut(prods.map(x => x.name).join(", "), 300), title: cut(mktConsent().title, 100), text: cut(mktConsent().text, 5000), at}] : []
    };
    const order = {
      uid: S.uid, lookupKeys: [k1, k2], consents, preorder: ls.some(l => !!l.p.preorder),
      statusLog: [{s: "입금대기", at, by: "주문자"}],
      items: ls.map(l => { const it = {pid: l.pid, name: cut(l.p.name, 100), price: unit(l.p), qty: l.qty}; if (l.opt) it.opt = cut(l.opt, 40); if (l.p.preorder) it.pre = true; return it; }),
      subtotal: t.sub, shipping: t.ship, total: t.total,
      buyer: {name, phone, email: cut(d.email, 100), zip: cut(d.zip, 10), address: cut(d.address, 200), address2: cut(d.address2, 200), memo: cut(d.memo, 300)},
      pay: "무통장입금", status: "입금대기", stockDeducted: false, createdAt: at
    };
    const sum = orderSummary(no, order); sum.sk = k2;
    const b = writeBatch(fdb);
    b.set(doc(fdb, "orders/" + no), order);
    b.set(doc(fdb, "orderStatus/" + k2), {no, status: "입금대기", log: [{s: "입금대기", at, by: "주문자"}], updatedAt: at});
    if (consents.marketing.length) b.set(doc(fdb, "marketing/" + no), {orderNo: no, name, phone, email: order.buyer.email, items: prods.map(x => cut(x.name, 100)), consents: consents.marketing, agreedAt: at, source: "주문"});
    b.set(doc(fdb, "lookups/" + k1), {orders: {[no]: sum}, updatedAt: Date.now()}, {merge: true});
    b.set(doc(fdb, "lookups/" + k2), {orders: {[no]: sum}, updatedAt: Date.now()});
    await withTimeout(b.commit());
    S.lastOrder = sum; S.drafts.checkout = null; S.keep = {};

/* image: resize in the browser before upload (max 2400px, JPEG) */
function shrink(file, max = 2400, q = 0.86){
  return new Promise(resolve => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      if (r === 1 && file.size < 1.5 * 1024 * 1024){ URL.revokeObjectURL(url); return resolve(file); }
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b || file), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
/* favicon: center-crop to a square and export a 512×512 PNG (keeps transparency) */
function squarePng(file, size){
  return new Promise(resolve => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height), sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      const c = document.createElement("canvas"); c.width = c.height = size;
      const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url); c.toBlob(b => resolve(b || file), "image/png");
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function uploadImages(input){
  if (!S.canUpload){ toast("이미지를 올릴 권한이 없어요"); return; }
  const key = input.closest("[data-draft]").dataset.draft, k = input.dataset.upload, multi = input.dataset.multi === "1";
  const files = [...input.files]; if (!files.length) return;
  S.uploading = k; render();
  const d = draft(key);
  try {
    for (const file of (multi ? files : files.slice(0, 1))){
      if (/hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name)){ toast(`${file.name}: 아이폰 HEIC 사진은 크롬 등 대부분의 브라우저에서 보이지 않아요. JPG로 바꿔서 올려 주세요.`); continue; }
      if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){ toast(`${file.name}: JPG, PNG, WEBP, GIF 이미지만 올릴 수 있어요`); continue; }
      if (file.size > 20 * 1024 * 1024){ toast(`${file.name}: 20MB 이하 이미지만 올릴 수 있어요`); continue; }
      const out = k === "favicon" ? await squarePng(file, 512) : await shrink(file);
      const ext = out.type === "image/png" ? "png" : out.type === "image/webp" ? "webp" : out.type === "image/gif" ? "gif" : "jpg";
      const r = storageRef(fstore, `images/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`);
      await withTimeout(uploadBytes(r, out, {contentType: out.type || "image/jpeg", cacheControl: "public, max-age=31536000"}), 120000);
      const url = await withTimeout(getDownloadURL(r));
      if (multi){ d[k] = Array.isArray(d[k]) ? d[k] : []; d[k].push(url); } else d[k] = url;
    }
  } catch(err){ toast(failMsg(err, "이미지를 올리지 못했어요.")); }
  S.uploading = null; render();
}

async function saveItem(col, form){
  if (firstInvalid(form)) return;
  const sch = SCHEMA[col], d = draft("edit");
  const miss = sch.fields.find(f => f.req && (f.t === "image") && !d[f.k]);
  if (miss){ toast(`${miss.l}을(를) 올려 주세요`); return; }
  const data = {};
  for (const f of sch.fields){
    let v = d[f.k];
    if (f.t === "number") v = (v === "" || v == null) ? null : Math.max(0, Math.round(Number(v)));
    else if (f.t === "images") v = Array.isArray(v) ? v : [];
    else if (f.t === "stocktotal") v = (v === "" || v == null) ? null : Math.max(0, Math.round(Number(v)));
    else if (f.t === "options"){
      const seen = new Set(); v = [];
      for (const o of (Array.isArray(d[f.k]) ? d[f.k] : [])){
        const name = String(o.name || "").trim().slice(0, 40); if (!name) continue;
        if (seen.has(name)){ toast(`'${name}'이(가) 두 번 들어 있어요`); return; } seen.add(name);
        const tt = o.total === "" || o.total == null ? null : Math.max(0, Math.round(Number(o.total)));
        if (tt !== null && isNaN(tt)){ toast(`'${name}'의 총 재고를 숫자로 적어 주세요`); return; }
        const sold = S.edit && S.edit.id ? salesOf(S.edit.id, name).sold : 0;
        v.push({name, total: tt, stock: tt === null ? null : Math.max(0, tt - sold)});
      }
    }
    else v = v == null ? "" : String(v).trim();
    data[f.k] = v;
  }
  if (col === "products"){
    const sold = S.edit && S.edit.id ? salesOf(S.edit.id, "").sold : 0;
    data.stock = data.stockTotal === null || data.stockTotal === undefined ? null : Math.max(0, data.stockTotal - sold);
  }
  if (col === "popups"){
    if (!S.edit.id && S.popups.length >= POP_MAX){ toast(`팝업은 최대 ${POP_MAX}개까지 등록할 수 있어요`); return; }
    if (data.end < data.start){ toast("게시 종료일이 시작일보다 빨라요"); return; }
    if (data.kind === "이미지" && !data.image){ toast("팝업 이미지를 올려 주세요"); return; }
    if (data.kind === "텍스트" && !data.text){ toast("팝업 내용을 적어 주세요"); return; }
  }
  if (col === "videos" && !ytId(data.url)){ toast("YouTube 링크 형식을 확인해 주세요"); return; }
  S.busy = true; render();
  try {
    if (S.edit.id){ const old = S[col].find(x => x.id === S.edit.id) || {}; await FS.doc(col + "/" + S.edit.id).set({...data, createdAt: old.createdAt || Date.now(), updatedAt: Date.now()}); }
    else await FS.collection(col).add({...data, createdAt: Date.now(), updatedAt: Date.now()});
    S.edit = null; S.drafts.edit = null; toast("저장했어요");
  } catch(err){ toast(failMsg(err, "저장하지 못했어요.")); }
  S.busy = false; render();
}

async function setOrderStatus(oid, status){
  try {
    const snap = await FS.doc("orders/" + oid).get(); if (!snap.exists) return;
    const o = snap.data();
    let delta = 0, stockDeducted = !!o.stockDeducted;
    if (DEDUCTED.includes(status) && !stockDeducted){ delta = -1; stockDeducted = true; }
    else if (!DEDUCTED.includes(status) && stockDeducted){ delta = 1; stockDeducted = false; }
    const at = Date.now(), entry = {s: status, at, by: "관리자" + (S.authUser && S.authUser.email ? ` ${S.authUser.email.split("@")[0]}` : "")};
    await FS.doc("orders/" + oid).update({status, stockDeducted, updatedAt: at, statusLog: arrayUnion(...(Array.isArray(o.statusLog) && o.statusLog.length ? [] : [{s: "입금대기", at: o.createdAt, by: "주문자"}]), entry)});
    const sk = (o.lookupKeys || [])[1];
    if (sk){ try { await FS.doc("orderStatus/" + sk).merge({no: oid, status, log: arrayUnion(entry), updatedAt: at}); } catch(e){ console.warn("status sync", e && e.code); } }
    for (const k of (o.lookupKeys || [])){ try { await FS.doc("lookups/" + k).update({["orders." + oid + ".status"]: status, updatedAt: Date.now()}); } catch(e){ console.warn("lookup sync", e && e.code); } }
    if (delta){
      const byP = {};
      for (const it of o.items || []) (byP[it.pid] = byP[it.pid] || []).push(it);
      for (const [pid, its] of Object.entries(byP)){
        const p = findP(pid); if (!p) continue;
        if (hasOpts(p)){
          const options = clone(p.options); let changed = false;
          for (const it of its){ const op = options.find(x => x.name === it.opt); if (op && optTracked(op)){ op.stock = Math.max(0, Number(op.stock) + delta * it.qty); changed = true; } }
          if (changed) await FS.doc("products/" + pid).update({options});
        } else if (tracked(p)){
          const n = its.reduce((a, it) => a + it.qty, 0);
          await FS.doc("products/" + pid).update({stock: Math.max(0, Number(p.stock) + delta * n)});
        }
      }
    }
    toast(`주문 상태를 '${status}'(으)로 바꿨어요${delta < 0 ? ", 재고 차감" : delta > 0 ? ", 재고 복구" : ""}`);
  } catch(err){ toast(failMsg(err, "상태를 바꾸지 못했어요.")); }
}
async function setInqStatus(qid, status){
  try { await FS.doc("inquiries/" + qid).update({status}); toast("처리 상태를 바꿨어요"); }
  catch(err){ toast(failMsg(err, "상태를 바꾸지 못했어요.")); }
}
/* the price a customer saw vs. the current catalogue — flags tampered or stale totals */
function expectedTotal(o){
  let sub = 0;
  for (const it of o.items || []){ const p = findP(it.pid); if (!p) return null; sub += unit(p) * (Number(it.qty) || 0); }
  return sub + shipFor(sub);
}

/* ---------- data ---------- */
const SORTERS = {
  schedules: (a, b) => String(a.date || "").localeCompare(String(b.date || "")) || String(a.time || "").localeCompare(String(b.time || "")),
  popups: (a, b) => (Number(a.order ?? 999) - Number(b.order ?? 999)) || ((a.createdAt || 0) - (b.createdAt || 0)),
  products: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
  videos: (a, b) => String(b.date || "").localeCompare(String(a.date || "")),
  gallery: (a, b) => String(b.date || "").localeCompare(String(a.date || "")) || (b.createdAt || 0) - (a.createdAt || 0),
  slides: (a, b) => (Number(a.order ?? 999) - Number(b.order ?? 999)) || ((a.createdAt || 0) - (b.createdAt || 0)),
  performances: (a, b) => String(b.date || "").localeCompare(String(a.date || "")),
  projects: (a, b) => String(b.year || "").localeCompare(String(a.year || "")),
  news: (a, b) => String(b.date || "").localeCompare(String(a.date || ""))
};
async function boot(){
  render();
  if (!S.online){ S.loaded = true; render(); return; }
  let pendingCols = Object.keys(SORTERS).length + 1;
  const done = () => { if (--pendingCols <= 0 && !S.loaded){ S.loaded = true; } };
  Object.keys(SORTERS).forEach(c => {
    let first = true;
    live((n, e) => FS.collection(c).onSnapshot(n, e), snap => { S[c] = snap.docs.map(d => ({id: d.id, ...d.data()})).sort(SORTERS[c]); if (first){ first = false; done(); } softRender(); }, c);
    setTimeout(() => { if (first){ first = false; done(); softRender(); } }, 5000);
  });
  let pFirst = true;
  live((n, e) => FS.doc("site/profile").onSnapshot(n, e), s => { S.profile = s.exists ? s.data() : {}; if (pFirst){ pFirst = false; done(); } applyMeta(); softRender(); }, "profile");
  live((n, e) => FS.doc("site/meta").onSnapshot(n, e), s => { S.meta = s.exists ? s.data() : {}; applyMeta(); }, "meta");
  live((n, e) => FS.doc("site/store").onSnapshot(n, e), s => { S.store = s.exists ? s.data() : {}; softRender(); }, "store");
  let myUnsub = null;
  onAuthStateChanged(fauth, async u => {
    S.authUser = u; S.uid = u ? u.uid : null;
    if (u && u.isAnonymous) flushTrack();
    S.isAdmin = !!u && !u.isAnonymous && ADMIN_UIDS.includes(u.uid);
    S.mfaEnrolled = !!u && !u.isAnonymous && multiFactor(u).enrolledFactors.length > 0;
    S.mfaOk = false;
    if (S.isAdmin){ try { const tok = await u.getIdTokenResult(); S.mfaOk = !!(tok.claims.firebase && tok.claims.firebase.sign_in_second_factor); } catch(e){} }
    const ok = S.isAdmin && (!REQUIRE_MFA || S.mfaOk);
    if (ok && !S.authed){ S.authed = true; startAdmin(); }
    else if (!ok && S.authed) stopAdmin();
    if (!u) signInAnonymously(fauth).catch(() => {});
    render();
  });
  setTimeout(() => { if (!S.loaded){ S.loaded = true; softRender(); } }, 6000);
}
lastRoute = location.hash;
document.getElementById("seo-static")?.remove();
gaInit(); trackView();
restartSlides();
boot();
})();
